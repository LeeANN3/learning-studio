<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的学习小屋 ✏️ My Learning Studio</title>
    <!-- 手绘可爱字体 -->
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 主容器 (移动端居中单列布局) -->
    <div class="app-container">

        <!-- 1. 顶部 Header 区 -->
        <header class="doodle-header">
            <div class="logo">🎈 学习小屋</div>
            <div class="date-badge" id="current-date">📅 8月3日</div>
        </header>

        <!-- 欢迎卡片 (动态显示学生姓名) -->
        <div class="macaron-card welcome-card">
            <div class="welcome-title" id="welcome-title">👋 嗨，<span class="highlight-macaron">同学</span>！</div>
            <div class="slogan">🌟 每天进步一点点，开启奇妙知识之旅！</div>
        </div>

        <!-- 2. 年级选择区域 -->
        <div class="section-title" id="grade-section-anchor">🎒 选择你的年级</div>
        <nav class="grade-nav">
            <button class="grade-btn active" data-grade="1">一年级</button>
            <button class="grade-btn" data-grade="2">二年级</button>
            <button class="grade-btn" data-grade="3">三年级</button>
            <button class="grade-btn" data-grade="4">四年级</button>
            <button class="grade-btn" data-grade="5">五年级</button>
            <button class="grade-btn" data-grade="6">六年级</button>
        </nav>

        <!-- 3. 主体动态加载区 -->
        <main class="main-container">

            <!-- 单元选择器/目录列表 -->
            <div class="macaron-card lesson-sidebar">
                <div class="subject-tag">📚 华文科单元目录</div>
                <ul class="lesson-menu" id="lesson-menu">
                    <!-- JS 动态生成单元列表 -->
                </ul>
            </div>

            <!-- 当前单元内容展示区 -->
            <section class="content-area">
                <!-- 单元标题 -->
                <div class="macaron-card lesson-header-card">
                    <h2 id="current-lesson-title" class="lesson-title">单元加载中...</h2>
                </div>

                <!-- 三大分类区块 -->
                <div class="cards-grid">
                    
                    <!-- 1. 测验区 (柔粉) -->
                    <div class="category-block bg-pink">
                        <h3 class="category-title">📝 测验 (Quiz)</h3>
                        <div class="card-list" id="quiz-list"></div>
                    </div>

                    <!-- 2. 复习区 (杏黄) -->
                    <div class="category-block bg-yellow">
                        <h3 class="category-title">🎴 复习 (Review)</h3>
                        <div class="card-list" id="review-list"></div>
                    </div>

                    <!-- 3. 游戏区 (薄荷蓝) -->
                    <div class="category-block bg-blue">
                        <h3 class="category-title">🎮 游戏 (Games)</h3>
                        <div class="card-list" id="game-list"></div>
                    </div>

                </div>
            </section>

        </main>

    </div>

    <!-- 4. 底部吸顶胶囊导航栏 (Bottom Nav Bar) -->
    <div class="bottom-nav">
        <div class="nav-item active" id="nav-home">
            <span class="nav-icon">🏠</span>
            <span>首页</span>
        </div>
        <div class="nav-item" id="nav-grade">
            <span class="nav-icon">📖</span>
            <span>年级</span>
        </div>
        <div class="nav-item" id="nav-msg" style="position: relative;">
            <span class="nav-icon">💌</span>
            <span>新消息</span>
            <div class="badge-dot"></div>
        </div>
        <div class="nav-item" id="nav-search">
            <span class="nav-icon">🔍</span>
            <span>搜寻</span>
        </div>
    </div>

    <!-- 5. 搜索模态弹窗 -->
    <div class="search-modal" id="search-modal">
        <div class="search-modal-content">
            <div class="search-modal-header">
                <h3>🔍 快速搜索</h3>
                <span class="close-modal" id="close-search">&times;</span>
            </div>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="输入关键字搜索单元/题目...">
            </div>
        </div>
    </div>

    <!-- 6. 新消息弹窗 -->
    <div class="search-modal" id="msg-modal">
        <div class="search-modal-content">
            <div class="search-modal-header">
                <h3>💌 老师的留言板</h3>
                <span class="close-modal" id="close-msg">&times;</span>
            </div>
            <div style="padding: 10px 0; color: #555; line-height: 1.6;">
                📢 欢迎来到华文学习小屋！记得每天完成对应的单元测验和练习哦！加油！✨
            </div>
        </div>
    </div>

    <!-- Firebase SDK (v8 兼容版) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <!-- 主业务逻辑 -->
    <script src="script.js"></script>
</body>
</html>
