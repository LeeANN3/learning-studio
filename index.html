<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun Learning Island - 登录/注册</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Patrick+Hand&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            font-family: 'Patrick Hand', 'ZCOOL KuaiLe', cursive, sans-serif;
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
            background-size: 20px 20px;
            min-height: 100vh;
            color: #0f172a;
        }
        .font-fun { font-family: 'Fredoka', 'ZCOOL KuaiLe', cursive; }
        .neo-card {
            background-color: #ffffff;
            border: 2px solid #0f172a;
            border-radius: 20px;
            box-shadow: 4px 4px 0px #0f172a;
        }
        .neo-btn {
            background-color: #ffe600;
            border: 2px solid #0f172a;
            border-radius: 12px;
            box-shadow: 2px 2px 0px #0f172a;
            transition: all 0.15s ease;
            font-family: 'Fredoka', 'ZCOOL KuaiLe', cursive;
            font-weight: 700;
        }
        .neo-btn:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0px #0f172a; background-color: #facc15; }
        .neo-input {
            border: 2px solid #0f172a; border-radius: 10px; outline: none; padding: 10px 14px; box-shadow: 2px 2px 0px #cbd5e1;
        }
        .neo-input:focus { box-shadow: 2px 2px 0px #ffe600; }
        .modal-overlay { background-color: rgba(15, 23, 42, 0.6); backdrop-filter: blur(2px); }
    </style>
</head>
<body class="flex items-center justify-center p-4 min-h-screen">

    <div class="neo-card max-w-md w-full p-6 sm:p-8 space-y-6 bg-white relative">
        <div class="text-center space-y-2">
            <div class="inline-block bg-amber-300 p-3 rounded-2xl border-2 border-slate-900 shadow-[3px_3px_0_#0f172a] mb-2">
                <i class="fa-solid fa-gamepad text-3xl"></i>
            </div>
            <h1 class="font-fun text-3xl font-bold text-slate-900">趣味学习岛</h1>
            <p class="text-xs text-slate-500 font-sans">Fun Learning Island - 学习中枢系统</p>
        </div>

        <!-- 登录与注册 Toggle -->
        <div class="flex border-2 border-slate-900 rounded-xl p-1 bg-slate-100 gap-1 font-fun">
            <button id="btn-toggle-login" onclick="switchAuthMode('login')" class="flex-1 py-1.5 text-sm font-bold rounded-lg bg-amber-300 border border-slate-900 shadow-[1px_1px_0_#0f172a]">登录账号</button>
            <button id="btn-toggle-register" onclick="switchAuthMode('register')" class="flex-1 py-1.5 text-sm font-bold rounded-lg text-slate-600 hover:text-slate-900">注册新账号</button>
        </div>

        <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-4">
            <div id="field-name" class="hidden">
                <label class="block text-xs font-bold text-slate-700 mb-1">您的姓名 / Name</label>
                <input type="text" id="input-name" class="neo-input w-full text-sm" placeholder="例如: 小明">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">电子邮箱 / Email</label>
                <input type="email" id="input-email" required class="neo-input w-full text-sm" placeholder="student@example.com">
            </div>

            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-xs font-bold text-slate-700">密码 / Password</label>
                    <button type="button" onclick="openResetPasswordModal()" class="text-xs text-sky-600 hover:underline font-bold">忘记密码？</button>
                </div>
                <input type="password" id="input-password" required class="neo-input w-full text-sm" placeholder="******">
            </div>

            <div id="field-class-code" class="hidden">
                <label class="block text-xs font-bold text-slate-700 mb-1">班级邀请码 / Class Code (选填)</label>
                <input type="text" id="input-class-code" class="neo-input w-full text-sm font-mono uppercase" placeholder="例如: G1-CHI-01">
            </div>

            <button type="submit" id="btn-submit" class="neo-btn w-full py-3 text-base flex items-center justify-center gap-2 mt-2">
                <i class="fa-solid fa-right-to-bracket"></i>
                <span id="btn-submit-text">登录系统</span>
            </button>
        </form>
    </div>

    <!-- 🔐 忘记密码 Modal -->
    <div id="reset-password-modal" class="fixed inset-0 modal-overlay z-50 flex items-center justify-center p-4 hidden">
        <div class="neo-card bg-white max-w-md w-full p-6 space-y-4">
            <h3 class="font-fun text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-key text-amber-500"></i>
                <span>重置您的账号密码</span>
            </h3>
            <p class="text-xs text-slate-600 leading-relaxed">
                请输入您注册时使用的电子邮箱，系统将发送一封密码重置邮件到您的邮箱。
            </p>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">注册 Email</label>
                <input type="email" id="reset-email-input" class="neo-input w-full text-sm" placeholder="your-email@example.com">
            </div>

            <div class="flex justify-end gap-3 pt-2">
                <button type="button" onclick="closeResetPasswordModal()" class="neo-btn bg-slate-100 hover:bg-slate-200 px-4 py-2 text-xs">取消</button>
                <button type="button" onclick="sendPasswordResetEmail()" class="neo-btn px-4 py-2 text-xs">发送重置邮件</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAqp_1JyuAtpQgJtnFRLhuVEmUIrx1YetI",
            authDomain: "my-teacher-studio.firebaseapp.com",
            projectId: "my-teacher-studio",
            storageBucket: "my-teacher-studio.firebasestorage.app",
            messagingSenderId: "82774284780",
            appId: "1:82774284780:web:e29680ea7a0e5c435ec8c9"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let authMode = 'login';

        // 登录自动拦截跳到 profile.html
        auth.onAuthStateChanged(user => {
            if (user) {
                window.location.href = "profile.html";
            }
        });

        function switchAuthMode(mode) {
            authMode = mode;
            const isReg = mode === 'register';
            document.getElementById('field-name').classList.toggle('hidden', !isReg);
            document.getElementById('field-class-code').classList.toggle('hidden', !isReg);
            
            document.getElementById('btn-toggle-login').className = !isReg 
                ? 'flex-1 py-1.5 text-sm font-bold rounded-lg bg-amber-300 border border-slate-900 shadow-[1px_1px_0_#0f172a]' 
                : 'flex-1 py-1.5 text-sm font-bold rounded-lg text-slate-600 hover:text-slate-900';
            
            document.getElementById('btn-toggle-register').className = isReg 
                ? 'flex-1 py-1.5 text-sm font-bold rounded-lg bg-amber-300 border border-slate-900 shadow-[1px_1px_0_#0f172a]' 
                : 'flex-1 py-1.5 text-sm font-bold rounded-lg text-slate-600 hover:text-slate-900';

            document.getElementById('btn-submit-text').innerText = isReg ? '创建新账号' : '登录系统';
        }

        async function handleAuthSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('input-email').value.trim();
            const password = document.getElementById('input-password').value.trim();

            if (authMode === 'login') {
                try {
                    await auth.signInWithEmailAndPassword(email, password);
                } catch (err) {
                    alert("⚠️ 登录失败：" + err.message);
                }
            } else {
                const name = document.getElementById('input-name').value.trim();
                const classCode = document.getElementById('input-class-code').value.trim().toUpperCase();
                if (!name) return alert("请填写您的姓名！");

                try {
                    const res = await auth.createUserWithEmailAndPassword(email, password);
                    const initialClasses = classCode ? [classCode] : [];

                    await db.collection("users").doc(res.user.uid).set({
                        name: name,
                        email: email,
                        role: "student",
                        status: "active",
                        enrolledClasses: initialClasses,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                } catch (err) {
                    alert("⚠️ 注册失败：" + err.message);
                }
            }
        }

        function openResetPasswordModal() { document.getElementById('reset-password-modal').classList.remove('hidden'); }
        function closeResetPasswordModal() { document.getElementById('reset-password-modal').classList.add('hidden'); }

        async function sendPasswordResetEmail() {
            const email = document.getElementById('reset-email-input').value.trim();
            if (!email) return alert("请输入 Email！");

            try {
                await auth.sendPasswordResetEmail(email);
                alert("🎉 重置邮件已发送！请检查您的邮箱 inbox 或垃圾邮件箱。");
                closeResetPasswordModal();
            } catch (err) {
                alert("⚠️ 发送失败：" + err.message);
            }
        }
    </script>
</body>
</html>
