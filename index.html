<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的学习小屋 ✏️ My Learning Studio</title>
    <!-- 引入手绘可爱字体 -->
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 中央核心应用容器 (适合手机，平板/电脑居中) -->
    <div class="app-container">

        <!-- 1. 顶部 Header 区 (Logo + Welcome) -->
        <header class="doodle-header">
            <div class="logo">🎈 学习小屋</div>
            <div class="date-badge">📅 8月3日 周一</div>
        </header>

        <!-- 欢迎卡片 & 标语 -->
        <div class="macaron-card welcome-card">
            <div class="welcome-title">👋 嗨，<span class="highlight-macaron">小明同学</span>！</div>
            <div class="slogan">🌟 每天进步一点点，开启奇妙知识之旅！</div>
        </div>

        <!-- 2. 年级选择区域 (水平滑动滚条，对触屏极友好) -->
        <div class="section-title">🎒 选择你的年级</div>
        <nav class="grade-nav">
            <button class="grade-btn active" data-grade="1">一年级</button>
            <button class="grade-btn" data-grade="2">二年级</button>
            <button class="grade-btn" data-grade="3">三年级</button>
            <button class="grade-btn" data-grade="4">四年级</button>
            <button class="grade-btn" data-grade="5">五年级</button>
            <button class="grade-btn" data-grade="6">六年级</button>
        </nav>

        <!-- 3. 主体动态加载区 -->
        <main class="main-container">

            <!-- 单元选择器/目录列表 -->
            <div class="macaron-card lesson-sidebar">
                <div class="subject-tag">📚 华文科单元目录</div>
                <ul class="lesson-menu" id="lesson-menu">
                    <!-- JS 动态生成单元列表 -->
                </ul>
            </div>

            <!-- 当前单元内容展示区 -->
            <section class="content-area">
                <!-- 单元标题 -->
                <div class="macaron-card lesson-header-card">
                    <h2 id="current-lesson-title" class="lesson-title">单元加载中...</h2>
                </div>

                <!-- 三大分类区块 (垂直排列，极大按键区) -->
                <div class="cards-grid">
                    
                    <!-- 1. 测验区 (马卡龙柔粉) -->
                    <div class="category-block bg-pink">
                        <h3 class="category-title">📝 测验 (Quiz)</h3>
                        <div class="card-list" id="quiz-list"></div>
                    </div>

                    <!-- 2. 复习区 (马卡龙杏黄) -->
                    <div class="category-block bg-yellow">
                        <h3 class="category-title">🎴 复习 (Review)</h3>
                        <div class="card-list" id="review-list"></div>
                    </div>

                    <!-- 3. 游戏区 (马卡龙薄荷蓝) -->
                    <div class="category-block bg-blue">
                        <h3 class="category-title">🎮 游戏 (Games)</h3>
                        <div class="card-list" id="game-list"></div>
                    </div>

                </div>
            </section>

        </main>

    </div>

    <!-- 4. 底部吸顶胶囊导航栏 (Bottom Nav Bar) -->
    <div class="bottom-nav">
        <div class="nav-item active">
            <span class="nav-icon">🏠</span>
            <span>首页</span>
        </div>
        <div class="nav-item">
            <span class="nav-icon">📖</span>
            <span>年级</span>
        </div>
        <div class="nav-item" style="position: relative;">
            <span class="nav-icon">💌</span>
            <span>新消息</span>
            <div class="badge-dot"></div>
        </div>
        <div class="nav-item" id="nav-search-btn">
            <span class="nav-icon">🔍</span>
            <span>搜寻</span>
        </div>
    </div>

    <!-- 5. 搜索模态弹窗 (点击底部搜寻时展开) -->
    <div class="search-modal" id="search-modal">
        <div class="search-modal-content">
            <div class="search-modal-header">
                <h3>🔍 快速搜索</h3>
                <span class="close-modal" id="close-search">&times;</span>
            </div>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="搜索单元/词汇...">
            </div>
        </div>
    </div>

    <!-- Firebase 核心 SDK (v8 兼容版) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <!-- 业务逻辑脚本 (完全保留原代码) -->
    <script src="script.js"></script>
    
    <!-- 模态框极简辅助小脚本 -->
    <script>
        // 搜寻弹窗控制脚本（不破坏原生 script.js）
        const searchBtn = document.getElementById('nav-search-btn');
        const searchModal = document.getElementById('search-modal');
        const closeSearch = document.getElementById('close-search');

        if(searchBtn && searchModal) {
            searchBtn.addEventListener('click', () => {
                searchModal.classList.add('show');
                document.getElementById('search-input').focus();
            });
            closeSearch.addEventListener('click', () => searchModal.classList.remove('show'));
        }
    </script>
</body>
</html>
