<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习乐园 - 登录与注册</title>
    <!-- FontAwesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK (v8 兼容版) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root {
            --bg-color: #FAF8F5;
            --card-bg: #FFFFFF;
            --text-main: #2C3E50;
            --border-color: #2C3E50;
            --accent-yellow: #FFEAA7;
            --accent-blue: #74B9FF;
            --accent-green: #55E6C1;
            --danger-red: #FF7675;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Microsoft YaHei', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 涂鸦风格涂鸦容器 */
        .auth-card {
            background: var(--card-bg);
            border: 3px solid var(--border-color);
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            box-shadow: 6px 6px 0px var(--border-color);
            width: 100%;
            max-width: 420px;
            padding: 30px 25px;
            position: relative;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .auth-header h1 {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .auth-header p {
            font-size: 0.95rem;
            color: #666;
        }

        /* Tab 切换 */
        .tab-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--accent-yellow);
            box-shadow: 3px 3px 0px var(--border-color);
            transform: translate(-2px, -2px);
        }

        /* 表单区域 */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group.hidden {
            display: none;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
        }

        .form-control, .form-select {
            width: 100%;
            padding: 12px 12px 12px 38px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 1rem;
            background: #FFF;
            outline: none;
        }

        .form-control:focus, .form-select:focus {
            background: #F0F8FF;
        }

        /* 单选按钮组 (角色选择) */
        .role-group {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }

        .role-option {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            background: #FFF;
        }

        .role-option input[type="radio"] {
            display: none;
        }

        .role-option.selected {
            background: var(--accent-blue);
            color: #FFF;
        }

        /* 提交按钮 */
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent-green);
            border: 2px solid var(--border-color);
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--border-color);
            margin-top: 10px;
            transition: all 0.1s;
        }

        .submit-btn:active {
            box-shadow: 1px 1px 0px var(--border-color);
            transform: translate(3px, 3px);
        }

        /* 提示信息 */
        .msg-box {
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 15px;
            display: none;
            text-align: center;
            font-weight: bold;
        }

        .msg-box.error {
            display: block;
            background: #FFE5E5;
            color: var(--danger-red);
            border: 1.5px solid var(--danger-red);
        }

        .msg-box.success {
            display: block;
            background: #E3FCEF;
            color: #00875A;
            border: 1.5px solid #00875A;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="auth-header">
            <h1>✏️ 学习乐园</h1>
            <p>快乐学习，探索新知识！</p>
        </div>

        <!-- 登录 / 注册 标签页切换 -->
        <div class="tab-group">
            <button class="tab-btn active" id="btn-tab-login" onclick="switchTab('login')">登录</button>
            <button class="tab-btn" id="btn-tab-register" onclick="switchTab('register')">注册账号</button>
        </div>

        <!-- 消息提示区域 -->
        <div id="msg-box" class="msg-box"></div>

        <!-- 表单内容 -->
        <form id="auth-form" onsubmit="handleAuth(event)">
            
            <!-- 姓名/昵称 (仅注册时可见) -->
            <div class="form-group hidden" id="group-name">
                <label for="user-name">你的名字 / 昵称</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="user-name" class="form-control" placeholder="例如：小明">
                </div>
            </div>

            <!-- 邮箱地址 -->
            <div class="form-group">
                <label for="user-email">电子邮箱 (Email)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="user-email" class="form-control" placeholder="name@example.com" required>
                </div>
            </div>

            <!-- 密码 -->
            <div class="form-group">
                <label for="user-password">密码</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="user-password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <!-- 身份选择 (仅注册时可见) -->
            <div class="form-group hidden" id="group-role">
                <label>选择你的身份</label>
                <div class="role-group">
                    <label class="role-option selected" id="opt-student" onclick="selectRole('student')">
                        <input type="radio" name="role" value="student" checked>
                        <i class="fa-solid fa-child"></i> 我是学生
                    </label>
                    <label class="role-option" id="opt-teacher" onclick="selectRole('teacher')">
                        <input type="radio" name="role" value="teacher">
                        <i class="fa-solid fa-chalkboard-user"></i> 我是老师
                    </label>
                </div>
            </div>

            <!-- 学生专属字段：年级 与 班级类型 (仅学生注册时可见) -->
            <div class="form-group hidden" id="group-student-grade">
                <label for="student-grade">所属年级</label>
                <div class="input-wrapper" style="margin-bottom: 12px;">
                    <i class="fa-solid fa-graduation-cap"></i>
                    <select id="student-grade" class="form-select">
                        <option value="1">一年级 (Grade 1)</option>
                        <option value="2">二年级 (Grade 2)</option>
                        <option value="3">三年级 (Grade 3)</option>
                        <option value="4">四年级 (Grade 4)</option>
                        <option value="5">五年级 (Grade 5)</option>
                        <option value="6">六年级 (Grade 6)</option>
                    </select>
                </div>

                <label for="student-class-type">班级类别</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-school"></i>
                    <select id="student-class-type" class="form-select">
                        <option value="all_subjects">安亲班 (全科 - 华/马/英/数/科)</option>
                        <option value="chinese_only">中文班 (仅华文)</option>
                    </select>
                </div>
            </div>

            <!-- 教师验证口令 (仅老师注册时可见) -->
            <div class="form-group hidden" id="group-teacher-key">
                <label for="teacher-key">教师验证口令</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-key"></i>
                    <input type="password" id="teacher-key" class="form-control" placeholder="请输入密钥（默认 TEACHER888）">
                </div>
            </div>

            <button type="submit" class="submit-btn" id="btn-submit">立即登录</button>
        </form>
    </div>

    <script>
        // ----------------------------------------------------
        // 1. Firebase 初始化配置 (请替换为您自己的 Firebase 配置对象)
        // ----------------------------------------------------
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // 初始化 Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        // 预设默认教师密钥
        const DEFAULT_TEACHER_KEY = "TEACHER888";

        // 当前模式: 'login' 或 'register'
        let currentMode = 'login';
        let selectedRole = 'student';

        // ----------------------------------------------------
        // 2. UI 交互控制函数
        // ----------------------------------------------------
        function switchTab(mode) {
            currentMode = mode;
            hideMessage();

            const btnLogin = document.getElementById('btn-tab-login');
            const btnRegister = document.getElementById('btn-tab-register');
            const groupName = document.getElementById('group-name');
            const groupRole = document.getElementById('group-role');
            const btnSubmit = document.getElementById('btn-submit');

            if (mode === 'login') {
                btnLogin.classList.add('active');
                btnRegister.classList.remove('active');
                
                groupName.classList.add('hidden');
                groupRole.classList.add('hidden');
                document.getElementById('group-student-grade').classList.add('hidden');
                document.getElementById('group-teacher-key').classList.add('hidden');

                btnSubmit.textContent = '立即登录';
            } else {
                btnRegister.classList.add('active');
                btnLogin.classList.remove('active');

                groupName.classList.remove('hidden');
                groupRole.classList.remove('hidden');

                updateRoleFields(); // 更新学生/教师专属输入框显示
                btnSubmit.textContent = '注册账号';
            }
        }

        function selectRole(role) {
            selectedRole = role;
            const optStudent = document.getElementById('opt-student');
            const optTeacher = document.getElementById('opt-teacher');

            if (role === 'student') {
                optStudent.classList.add('selected');
                optTeacher.classList.remove('selected');
            } else {
                optTeacher.classList.add('selected');
                optStudent.classList.remove('selected');
            }

            updateRoleFields();
        }

        function updateRoleFields() {
            if (currentMode !== 'register') return;

            const groupStudent = document.getElementById('group-student-grade');
            const groupTeacher = document.getElementById('group-teacher-key');

            if (selectedRole === 'student') {
                groupStudent.classList.remove('hidden');
                groupTeacher.classList.add('hidden');
            } else {
                groupStudent.classList.add('hidden');
                groupTeacher.classList.remove('hidden');
            }
        }

        function showMessage(msg, isError = true) {
            const box = document.getElementById('msg-box');
            box.textContent = msg;
            box.className = isError ? 'msg-box error' : 'msg-box success';
        }

        function hideMessage() {
            const box = document.getElementById('msg-box');
            box.style.display = 'none';
        }

        // ----------------------------------------------------
        // 3. 登录与注册提交逻辑
        // ----------------------------------------------------
        async function handleAuth(event) {
            event.preventDefault();
            hideMessage();

            const email = document.getElementById('user-email').value.trim();
            const password = document.getElementById('user-password').value;

            if (currentMode === 'login') {
                // 执行登录操作
                try {
                    await auth.signInWithEmailAndPassword(email, password);
                    showMessage('登录成功！正在跳转...', false);
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } catch (error) {
                    console.error("登录失败:", error);
                    showMessage('登录失败：' + getErrorMessage(error.code));
                }
            } else {
                // 执行注册操作
                const name = document.getElementById('user-name').value.trim();
                if (!name) {
                    showMessage('请输入你的名字或昵称');
                    return;
                }

                // 校验教师密钥
                if (selectedRole === 'teacher') {
                    const inputKey = document.getElementById('teacher-key').value.trim();
                    if (inputKey !== DEFAULT_TEACHER_KEY) {
                        showMessage('教师验证口令错误，无法注册为老师！');
                        return;
                    }
                }

                const grade = document.getElementById('student-grade').value;
                const classType = document.getElementById('student-class-type').value;

                try {
                    // 1. 创建 Firebase Auth 用户
                    const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                    const user = userCredential.user;

                    // 2. 写入 Firestore 数据库
                    await db.collection("users").doc(user.uid).set({
                        uid: user.uid,
                        name: name,
                        email: email,
                        role: selectedRole,
                        grade: selectedRole === 'student' ? parseInt(grade) : 0,
                        classType: selectedRole === 'student' ? classType : 'all_subjects',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    showMessage('注册成功！正在进入大厅...', false);
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1200);

                } catch (error) {
                    console.error("注册失败:", error);
                    showMessage('注册失败：' + getErrorMessage(error.code));
                }
            }
        }

        // 自动登录检测：如果已经登录过，直接跳到 dashboard.html
        auth.onAuthStateChanged((user) => {
            if (user && currentMode === 'login') {
                window.location.href = 'dashboard.html';
            }
        });

        // 错误提示翻译
        function getErrorMessage(code) {
            switch (code) {
                case 'auth/user-not-found': return '找不到该账号，请先注册';
                case 'auth/wrong-password': return '密码错误，请重新输入';
                case 'auth/email-already-in-use': return '该邮箱已经被注册过了';
                case 'auth/weak-password': return '密码强度太弱，至少需要6位字符';
                case 'auth/invalid-email': return '邮箱格式不正确';
                default: return '网络错误或未知异常，请重试';
            }
        }
    </script>
</body>
</html>
