<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun Learning Island - Login & Register</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Patrick+Hand&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            font-family: 'Patrick Hand', 'ZCOOL KuaiLe', cursive, sans-serif;
            background-color: #fafafa;
            background-image: radial-gradient(#e5e7eb 1.2px, transparent 1.2px);
            background-size: 20px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #1a1a1a;
        }

        .auth-card {
            background-color: #ffffff;
            border-radius: 20px;
            border: 2px solid #1a1a1a;
            box-shadow: 4px 4px 0px #1a1a1a;
            width: 100%;
            max-width: 460px;
            padding: 32px 28px 28px;
            position: relative;
        }

        .lang-switch-container { position: absolute; top: 18px; right: 20px; }
        .btn-lang {
            background: #ffffff;
            border: 2px solid #1a1a1a;
            border-radius: 12px;
            padding: 4px 12px;
            font-family: 'Fredoka', 'ZCOOL KuaiLe', cursive;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 2px 2px 0px #1a1a1a;
            display: flex; align-items: center; gap: 6px;
        }
        .btn-lang:hover { background: #ffe600; transform: translate(-1px, -1px); box-shadow: 3px 3px 0px #1a1a1a; }

        .auth-header { text-align: center; margin-bottom: 20px; margin-top: 6px; }
        .auth-header .logo-badge {
            background-color: #ffffff; border: 2px solid #1a1a1a;
            width: 64px; height: 64px; border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 12px; font-size: 30px; color: #1a1a1a;
            box-shadow: 3px 3px 0px #1a1a1a;
        }

        .tab-switch { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn {
            flex: 1; padding: 10px; border: 2px solid #1a1a1a; background: #ffffff;
            font-family: 'Fredoka', 'ZCOOL KuaiLe', cursive; font-size: 15px; font-weight: 600;
            border-radius: 14px; cursor: pointer; box-shadow: 2px 2px 0px #1a1a1a;
        }
        .tab-btn.active { background-color: #ffe600; box-shadow: 3px 3px 0px #1a1a1a; font-weight: 700; }

        .role-selector {
            display: flex; gap: 10px; margin-bottom: 16px;
            background: #f4f4f5; padding: 6px; border-radius: 14px; border: 2px solid #1a1a1a;
        }
        .role-btn {
            flex: 1; padding: 8px; text-align: center; border-radius: 10px; cursor: pointer;
            font-family: 'Fredoka', 'ZCOOL KuaiLe', cursive; font-size: 15px; font-weight: 600;
            border: 2px solid transparent; transition: all 0.15s ease;
        }
        .role-btn.active { background: #ffffff; border-color: #1a1a1a; box-shadow: 2px 2px 0px #1a1a1a; }

        .form-group { margin-bottom: 14px; text-align: left; }
        .form-group label { display: block; font-size: 15px; font-weight: 600; margin-bottom: 5px; }
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 15px; }
        
        .form-control {
            width: 100%; padding: 10px 14px 10px 38px;
            border: 2px solid #1a1a1a; border-radius: 12px;
            font-family: 'Patrick Hand', 'ZCOOL KuaiLe', cursive; font-size: 16px;
            outline: none; background-color: #ffffff;
        }
        .form-control:focus { box-shadow: 3px 3px 0px #ffe600; }

        .btn-submit {
            width: 100%; padding: 12px; background-color: #1a1a1a; color: #ffffff;
            border: 2px solid #1a1a1a; border-radius: 14px;
            font-family: 'Fredoka', 'ZCOOL KuaiLe', cursive; font-size: 18px; font-weight: 700;
            cursor: pointer; box-shadow: 3px 3px 0px #1a1a1a; margin-top: 6px;
            transition: all 0.15s ease;
        }
        .btn-submit:hover { background-color: #ffe600; color: #1a1a1a; box-shadow: 4px 4px 0px #1a1a1a; }

        .forgot-link-container { text-align: right; margin-top: 4px; margin-bottom: 10px; }
        .forgot-link { font-size: 14px; text-decoration: underline; cursor: pointer; }

        .message-box {
            padding: 10px 14px; border-radius: 12px; font-size: 14px;
            margin-bottom: 14px; display: none; text-align: center; border: 2px solid #1a1a1a;
        }
        .message-box.error { background-color: #ffffff; color: #d90429; border-color: #d90429; display: block; }
        .message-box.success { background-color: #ffe600; color: #1a1a1a; display: block; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="lang-switch-container">
            <button type="button" class="btn-lang" onclick="toggleLanguage()">
                <i class="fa-solid fa-globe"></i>
                <span id="lang-btn-text">English</span>
            </button>
        </div>

        <div class="auth-header">
            <div class="logo-badge"><i class="fa-solid fa-gamepad"></i></div>
            <h1 id="txt-title" style="font-family:'Fredoka', 'ZCOOL KuaiLe'; font-size:24px;">趣味学习岛</h1>
            <p id="txt-subtitle" style="font-size:15px; color:#666;">登录账号开启学习冒险！</p>
        </div>

        <!-- 登录 / 注册 Tab -->
        <div class="tab-switch">
            <button type="button" class="tab-btn active" id="tab-login" onclick="switchTab('login')">
                <span id="txt-tab-login">登录</span>
            </button>
            <button type="button" class="tab-btn" id="tab-register" onclick="switchTab('register')">
                <span id="txt-tab-register">新用户注册</span>
            </button>
        </div>

        <div id="message-box" class="message-box"></div>

        <form id="auth-form" onsubmit="handleAuth(event)">
            
            <!-- 1. 注册身份选择（学生 or 老师） -->
            <div class="form-group hidden" id="group-role-select">
                <label id="lbl-identity">注册身份 / Identity:</label>
                <div class="role-selector">
                    <div class="role-btn active" id="role-student" onclick="selectRole('student')">
                        <i class="fa-solid fa-user-graduate"></i> <span id="txt-role-student">我是学生</span>
                    </div>
                    <div class="role-btn" id="role-teacher" onclick="selectRole('teacher')">
                        <i class="fa-solid fa-chalkboard-user"></i> <span id="txt-role-teacher">我是老师</span>
                    </div>
                </div>
            </div>

            <!-- 2. 姓名/昵称 (注册时可见) -->
            <div class="form-group hidden" id="group-display-name">
                <label for="display-name" id="lbl-name">姓名 / 昵称</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="display-name" class="form-control" placeholder="例如：小明 / Alex">
                </div>
            </div>

            <!-- 3. 班级邀请码 (仅学生注册时可见) -->
            <div class="form-group hidden" id="group-class-code">
                <label for="class-code" id="lbl-class-code">班级邀请码 (选填/老师提供)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-ticket"></i>
                    <input type="text" id="class-code" class="form-control" placeholder="如：G1-GRAM-01、M1-01（未填可后续分配）">
                </div>
            </div>

            <!-- 4. 教师验证口令 (仅老师注册时可见) -->
            <div class="form-group hidden" id="group-teacher-key">
                <label for="teacher-key" id="lbl-teacher-key">教师验证口令 (Teacher Key)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-key"></i>
                    <input type="password" id="teacher-key" class="form-control" placeholder="请输入教师注册密钥（默认 TEACHER888）">
                </div>
            </div>

            <!-- 5. 电子邮箱 -->
            <div class="form-group">
                <label for="email" id="lbl-email">电子邮箱</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" class="form-control" placeholder="student@school.com" required>
                </div>
            </div>

            <!-- 6. 密码 -->
            <div class="form-group">
                <label for="password" id="lbl-password">密码</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <div class="forgot-link-container" id="forgot-password-container">
                <span class="forgot-link" id="txt-forgot-password" onclick="handleForgotPassword()">忘记密码？</span>
            </div>

            <button type="submit" id="submit-btn" class="btn-submit">
                <span id="txt-submit-btn">立即登录</span>
            </button>
        </form>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAqp_1JyuAtpQgJtnFRLhuVEmUIrx1YetI",
            authDomain: "my-teacher-studio.firebaseapp.com",
            projectId: "my-teacher-studio",
            storageBucket: "my-teacher-studio.firebasestorage.app",
            messagingSenderId: "82774284780",
            appId: "1:82774284780:web:e29680ea7a0e5c435ec8c9"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // 默认教师注册密钥
        const DEFAULT_TEACHER_KEY = "TEACHER888";

        let currentMode = 'login';
        let selectedRole = 'student';
        let currentLang = 'zh';
        let isSubmitting = false;

        const translations = {
            zh: {
                langBtn: "English", title: "趣味学习岛", subtitle: "登录账号开启学习冒险！",
                tabLogin: "登录", tabRegister: "新用户注册",
                lblIdentity: "注册身份：", roleStudent: "我是学生", roleTeacher: "我是老师",
                lblName: "姓名 / 昵称", namePlaceholder: "例如：小明 / Alex",
                lblClassCode: "班级邀请码 (选填/老师提供)", classCodePlaceholder: "如：G1-GRAM-01、M1-01（未填可后续分配）",
                lblTeacherKey: "教师验证口令 (Teacher Key)", teacherKeyPlaceholder: "请输入教师注册密钥（默认 TEACHER888）",
                lblEmail: "电子邮箱", lblPassword: "密码", pwdPlaceholder: "至少6位",
                forgotPwd: "忘记密码？", btnLogin: "立即登录", btnRegister: "注册并登录",
                processing: "处理中...", successLogin: "登录成功！", successRegister: "注册成功！",
                errWrongTeacherKey: "教师验证口令错误！请联系管理员。", errRequireName: "请输入姓名！",
                pwdResetSent: "密码重置邮件已发送，请检查您的邮箱！", errEnterEmail: "请先在上方输入框填写您的电子邮箱！"
            },
            en: {
                langBtn: "中文", title: "Fun Learning Island", subtitle: "Log in to start learning!",
                tabLogin: "Log In", tabRegister: "Register",
                lblIdentity: "Identity:", roleStudent: "Student", roleTeacher: "Teacher",
                lblName: "Name / Nickname", namePlaceholder: "e.g., Alex",
                lblClassCode: "Class Code (Optional)", classCodePlaceholder: "e.g. G1-GRAM-01, M1-01",
                lblTeacherKey: "Teacher Security Key", teacherKeyPlaceholder: "Enter Teacher Key (Default: TEACHER888)",
                lblEmail: "Email", lblPassword: "Password", pwdPlaceholder: "Min 6 characters",
                forgotPwd: "Forgot Password?", btnLogin: "Log In", btnRegister: "Register",
                processing: "Processing...", successLogin: "Logged in!", successRegister: "Registered!",
                errWrongTeacherKey: "Incorrect Teacher Security Key!", errRequireName: "Please enter your name!",
                pwdResetSent: "Password reset link sent to your email!", errEnterEmail: "Please enter your email above first!"
            }
        };

        function toggleLanguage() {
            currentLang = (currentLang === 'zh') ? 'en' : 'zh';
            updatePageText();
        }

        function updatePageText() {
            const t = translations[currentLang];
            document.getElementById('lang-btn-text').innerText = t.langBtn;
            document.getElementById('txt-title').innerText = t.title;
            document.getElementById('txt-subtitle').innerText = t.subtitle;
            document.getElementById('txt-tab-login').innerText = t.tabLogin;
            document.getElementById('txt-tab-register').innerText = t.tabRegister;
            document.getElementById('lbl-identity').innerText = t.lblIdentity;
            document.getElementById('txt-role-student').innerText = t.roleStudent;
            document.getElementById('txt-role-teacher').innerText = t.roleTeacher;
            document.getElementById('lbl-name').innerText = t.lblName;
            document.getElementById('display-name').placeholder = t.namePlaceholder;
            document.getElementById('lbl-class-code').innerText = t.lblClassCode;
            document.getElementById('class-code').placeholder = t.classCodePlaceholder;
            document.getElementById('lbl-teacher-key').innerText = t.lblTeacherKey;
            document.getElementById('teacher-key').placeholder = t.teacherKeyPlaceholder;
            document.getElementById('lbl-email').innerText = t.lblEmail;
            document.getElementById('lbl-password').innerText = t.lblPassword;
            document.getElementById('password').placeholder = t.pwdPlaceholder;
            document.getElementById('txt-forgot-password').innerText = t.forgotPwd;

            const submitBtn = document.getElementById('submit-btn');
            if (!submitBtn.disabled) {
                document.getElementById('txt-submit-btn').innerText = currentMode === 'login' ? t.btnLogin : t.btnRegister;
            }
        }

        // 仅在非表单提交操作时（例如刷新页面已登录状态）跳转
        auth.onAuthStateChanged((user) => {
            if (user && !isSubmitting) {
                window.location.href = "profile.html";
            }
        });

        function switchTab(mode) {
            currentMode = mode;
            const t = translations[currentLang];
            document.getElementById('tab-login').classList.toggle('active', mode === 'login');
            document.getElementById('tab-register').classList.toggle('active', mode === 'register');
            
            document.getElementById('group-role-select').classList.toggle('hidden', mode === 'login');
            document.getElementById('group-display-name').classList.toggle('hidden', mode === 'login');
            document.getElementById('forgot-password-container').classList.toggle('hidden', mode === 'register');

            if (mode === 'register') {
                selectRole(selectedRole);
            } else {
                document.getElementById('group-class-code').classList.add('hidden');
                document.getElementById('group-teacher-key').classList.add('hidden');
            }

            document.getElementById('txt-submit-btn').innerText = mode === 'login' ? t.btnLogin : t.btnRegister;
        }

        function selectRole(role) {
            selectedRole = role;
            document.getElementById('role-student').classList.toggle('active', role === 'student');
            document.getElementById('role-teacher').classList.toggle('active', role === 'teacher');

            if (currentMode === 'register') {
                document.getElementById('group-class-code').classList.toggle('hidden', role !== 'student');
                document.getElementById('group-teacher-key').classList.toggle('hidden', role !== 'teacher');
            }
        }

        async function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const displayName = document.getElementById('display-name').value.trim();
            const classCodeRaw = document.getElementById('class-code').value.trim();
            const teacherKey = document.getElementById('teacher-key').value.trim();
            const t = translations[currentLang];

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            document.getElementById('txt-submit-btn').innerText = t.processing;

            isSubmitting = true;

            try {
                if (currentMode === 'login') {
                    await auth.signInWithEmailAndPassword(email, password);
                    window.location.href = "profile.html";
                } else {
                    if (!displayName) throw { message: t.errRequireName };

                    // 1. 校验教师注册密钥
                    if (selectedRole === 'teacher' && teacherKey !== DEFAULT_TEACHER_KEY) {
                        throw { message: t.errWrongTeacherKey };
                    }

                    // 2. 创建 Firebase Auth 账号
                    const cred = await auth.createUserWithEmailAndPassword(email, password);
                    await cred.user.updateProfile({ displayName: displayName });

                    // 3. 提取班级码与状态设定
                    let enrolledClasses = [];
                    let initialStatus = 'active';

                    if (selectedRole === 'student') {
                        if (classCodeRaw) {
                            enrolledClasses.push(classCodeRaw.toUpperCase());
                        } else {
                            initialStatus = 'pending_approval'; // 没填班级码设为待分配状态
                        }
                    }

                    // 4. 写入 Firestore 数据库
                    await db.collection("users").doc(cred.user.uid).set({
                        name: displayName,
                        email: email,
                        role: selectedRole, // 'student' 或 'teacher'
                        status: initialStatus, // 'active' 或 'pending_approval'
                        enrolledClasses: enrolledClasses,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    // 5. 跳转至 Profile 个人中枢
                    window.location.href = "profile.html";
                }
            } catch (err) {
                isSubmitting = false;
                showMessage(err.message, 'error');
                submitBtn.disabled = false;
                document.getElementById('txt-submit-btn').innerText = currentMode === 'login' ? t.btnLogin : t.btnRegister;
            }
        }

        function showMessage(msg, type) {
            const msgBox = document.getElementById('message-box');
            msgBox.innerText = msg;
            msgBox.className = `message-box ${type}`;
        }

        function handleForgotPassword() {
            const email = document.getElementById('email').value.trim();
            const t = translations[currentLang];
            if (!email) {
                showMessage(t.errEnterEmail, "error");
                return;
            }
            auth.sendPasswordResetEmail(email).then(() => {
                showMessage(t.pwdResetSent, "success");
            }).catch(err => {
                showMessage(err.message, "error");
            });
        }
    </script>
</body>
</html>
