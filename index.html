<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老师的学习小屋 ✏️ Teacher Studio</title>
    <!-- 手绘可爱字体 -->
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 🔒 登录弹窗 Overlay -->
<div id="login-modal" class="login-modal-overlay">
    <div class="login-card">
        <div class="login-icon">🔑</div>
        <h2>学习小屋登录</h2>
        <p class="login-subtitle">请输入你的通行密码进入</p>
        
        <div class="input-group">
            <input 
                type="text" 
                id="login-password" 
                placeholder="请输入密码 (如 ZSY8888)" 
                style="text-transform: uppercase;"
                oninput="this.value = this.value.toUpperCase();"
                autocomplete="off"
            >
        </div>
        
        <div id="login-error-msg" class="error-msg" style="color: #ff4d4f; margin: 10px 0; font-size: 14px; min-height: 20px;"></div>
        
        <button class="login-btn" id="login-submit-btn" onclick="handleLogin()">🚀 开启学习之旅</button>
    </div>
</div>

    <!-- 顶栏：Logo + 年级导航 + 搜索 -->
    <header class="doodle-header">
        <div class="logo">✏️ 学习小屋 Studio</div>
        
        <!-- 年级切换 Tab -->
        <nav class="grade-nav">
            <button class="grade-btn active" data-grade="1">一年级</button>
            <button class="grade-btn" data-grade="2">二年级</button>
            <button class="grade-btn" data-grade="3">三年级</button>
            <button class="grade-btn" data-grade="4">四年级</button>
            <button class="grade-btn" data-grade="5">五年级</button>
            <button class="grade-btn" data-grade="6">六年级</button>
        </nav>

        <!-- 搜索框与退出按钮 -->
        <div class="header-right">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="🔍 搜索单元/词汇...">
            </div>
            <button class="logout-btn" id="logout-btn" onclick="handleLogout()" style="display: none;">退出</button>
        </div>
    </header>

    <!-- 主体区域：左侧单元目录 + 右侧内容卡片 -->
    <main class="main-container">

        <!-- 左侧目录 (侧边栏) -->
        <aside class="sidebar">
            <div class="subject-tag">📚 华文科</div>
            <ul class="lesson-menu" id="lesson-menu">
                <!-- 动态生成单元列表 -->
            </ul>
        </aside>

        <!-- 右侧内容区块 -->
        <section class="content-area">
            <h2 id="current-lesson-title" class="lesson-title">单元加载中...</h2>

            <!-- 🌟 欢迎语区 -->
            <div id="welcome-bar" class="welcome-tag" style="display:none;">👋 欢迎你！</div>

            <!-- 📢 最新消息区块 -->
            <div class="announcement-block" id="announcement-block">
                <div class="announcement-header">
                    <span class="announcement-title">📢 最新消息</span>
                    <span class="teacher-tag">老师发布</span>
                </div>
                <div class="announcement-content" id="announcement-content">
                    欢迎来到学习小屋！请选择左侧单元开始学习与测评～
                </div>
            </div>

            <!-- 3. 三大分类区块 (测验 / 复习 / 游戏) -->
            <div class="cards-grid">
                
                <!-- 1. 测验区 -->
                <div class="category-block bg-pink">
                    <h3 class="category-title">📝 测验 (Quiz)</h3>
                    <div class="card-list" id="quiz-list"></div>
                </div>

                <!-- 2. 复习区 -->
                <div class="category-block bg-yellow">
                    <h3 class="category-title">🎴 复习 (Review)</h3>
                    <div class="card-list" id="review-list"></div>
                </div>

                <!-- 3. 游戏区 -->
                <div class="category-block bg-blue">
                    <h3 class="category-title">🎮 游戏 (Games)</h3>
                    <div class="card-list" id="game-list"></div>
                </div>

            </div>
        </section>

    </main>
    
    <!-- 1. 引入 Firebase 核心 SDK (v8 兼容版) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <!-- 2. 引入 Firestore 数据库 SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <!-- 3. 业务逻辑脚本 -->
    <script src="script.js"></script>
</body>
</html>
