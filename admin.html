<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun Learning Island - Teacher Admin Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Patrick+Hand&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            font-family: 'Patrick Hand', 'ZCOOL KuaiLe', cursive, sans-serif;
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
            background-size: 20px 20px;
            min-height: 100vh;
            color: #0f172a;
        }
        .font-fun { font-family: 'Fredoka', 'ZCOOL KuaiLe', cursive; }
        .neo-card { background-color: #ffffff; border: 2px solid #0f172a; border-radius: 16px; box-shadow: 4px 4px 0px #0f172a; }
        .neo-btn { background-color: #ffffff; border: 2px solid #0f172a; border-radius: 12px; box-shadow: 2px 2px 0px #0f172a; transition: all 0.15s ease; font-family: 'Fredoka', 'ZCOOL KuaiLe', cursive; font-weight: 600; }
        .neo-btn:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0px #0f172a; }
        .neo-btn-primary { background-color: #ffe600; }
        .neo-btn-primary:hover { background-color: #facc15; }
        .neo-btn-danger { background-color: #fee2e2; color: #dc2626; border-color: #dc2626; box-shadow: 2px 2px 0px #dc2626; }
        .neo-input { border: 2px solid #0f172a; border-radius: 10px; outline: none; padding: 8px 12px; box-shadow: 2px 2px 0px #cbd5e1; }
        .tab-btn { padding: 10px 18px; border-radius: 12px; border: 2px solid #0f172a; background: #ffffff; font-weight: 700; cursor: pointer; box-shadow: 2px 2px 0px #0f172a; white-space: nowrap; }
        .tab-btn.active { background: #ffe600; box-shadow: 3px 3px 0px #0f172a; }
        .modal-overlay { background-color: rgba(15, 23, 42, 0.6); backdrop-filter: blur(2px); }
    </style>
</head>
<body class="pb-10">

    <nav class="bg-white border-b-2 border-slate-900 sticky top-0 z-40 px-3 sm:px-6 py-2.5 shadow-[0_4px_0_#0f172a]">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                    <div class="bg-amber-300 p-2 rounded-xl border-2 border-slate-900 shadow-[2px_2px_0_#0f172a]">
                        <i class="fa-solid fa-chalkboard-user text-lg sm:text-xl"></i>
                    </div>
                    <div>
                        <h1 class="font-fun text-lg sm:text-xl font-bold leading-tight">教师管理后台</h1>
                        <p class="text-[10px] sm:text-xs text-slate-500 font-sans">Teacher Admin Dashboard</p>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 sm:flex items-center gap-2">
                <a href="profile.html" class="neo-btn px-3 py-1.5 text-xs sm:text-sm flex items-center justify-center gap-1.5 bg-amber-100">
                    <i class="fa-solid fa-user-gear"></i>
                    <span>个人 Profile</span>
                </a>
                <a href="dashboard.html" class="neo-btn px-3 py-1.5 text-xs sm:text-sm flex items-center justify-center gap-1.5 bg-sky-100">
                    <i class="fa-solid fa-graduation-cap"></i>
                    <span>学生端</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 mt-6">

        <div class="neo-card p-5 sm:p-6 mb-6 bg-amber-50">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <h2 class="font-fun text-xl sm:text-2xl font-bold">🏫 补习班多班级管控中心</h2>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 w-full md:w-auto">
                    <a href="content-manager.html" class="neo-btn neo-btn-primary px-3.5 py-2 flex items-center justify-center gap-2 text-xs sm:text-sm">
                        <i class="fa-solid fa-folder-plus"></i> 题库管控
                    </a>
                    <a href="leaderboard-admin.html" class="neo-btn bg-amber-200 px-3.5 py-2 flex items-center justify-center gap-2 text-xs sm:text-sm">
                        <i class="fa-solid fa-trophy"></i> 独立成绩榜
                    </a>
                    <a href="announcement-admin.html" class="neo-btn bg-sky-200 px-3.5 py-2 flex items-center justify-center gap-2 text-xs sm:text-sm">
                        <i class="fa-solid fa-bullhorn"></i> 布告管理
                    </a>
                </div>
            </div>
        </div>

        <div class="flex gap-2 sm:gap-3 overflow-x-auto pb-2 mb-6">
            <button onclick="switchTab('students')" id="tab-students" class="tab-btn active font-fun text-xs sm:text-sm">学生账号与名册管理</button>
            <button onclick="switchTab('classes')" id="tab-classes" class="tab-btn font-fun text-xs sm:text-sm">班级码与时间段设置</button>
            <button onclick="switchTab('unlock')" id="tab-unlock" class="tab-btn font-fun text-xs sm:text-sm">课程/测验可见性开关</button>
        </div>

        <!-- TAB 1: STUDENTS -->
        <section id="section-students" class="space-y-4">
            <div class="neo-card p-4 sm:p-5">
                <div class="overflow-x-auto rounded-xl border-2 border-slate-900">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-100 border-b-2 border-slate-900 font-fun text-xs sm:text-sm">
                                <th class="p-3">学生姓名</th>
                                <th class="p-3">Email</th>
                                <th class="p-3">所属班级</th>
                                <th class="p-3 text-center">操作 (修改名字/班级)</th>
                            </tr>
                        </thead>
                        <tbody id="student-table-body" class="divide-y border-slate-200 text-xs sm:text-sm font-sans"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- TAB 3: CLASSES (含时间段) -->
        <section id="section-classes" class="space-y-4 hidden">
            <div class="neo-card p-4 sm:p-5">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-fun text-lg font-bold">班级列表与上课时间配置</h3>
                    <button onclick="openCreateClassModal()" class="neo-btn neo-btn-primary px-3 py-1.5 text-xs sm:text-sm">+ 新增班级 Code</button>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5" id="class-cards-container"></div>
            </div>
        </section>

        <!-- TAB 4: UNLOCK -->
        <section id="section-unlock" class="space-y-4 hidden">
            <div class="neo-card p-4 sm:p-5">
                <div class="overflow-x-auto rounded-xl border-2 border-slate-900 bg-white">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-100 border-b-2 border-slate-900 font-fun text-xs sm:text-sm">
                                <th class="p-3">资源名称</th>
                                <th class="p-3">科目/年级/单元</th>
                                <th class="p-3">授权班级</th>
                            </tr>
                        </thead>
                        <tbody id="resource-table-body" class="divide-y border-slate-200 text-xs sm:text-sm font-sans"></tbody>
                    </table>
                </div>
            </div>
        </section>

    </div>

    <!-- ✏️ 4. 修改学生姓名与班级 Modal -->
    <div id="edit-student-modal" class="fixed inset-0 modal-overlay z-50 flex items-center justify-center p-4 hidden">
        <div class="neo-card bg-white max-w-md w-full p-6 space-y-4">
            <h3 class="font-fun text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-user-pen text-amber-500"></i>
                <span>修改学生资料</span>
            </h3>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">学生真实姓名 (修正乱取名字)</label>
                <input type="text" id="modal-student-name-input" class="neo-input w-full text-sm font-bold">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">勾选包含班级：</label>
                <div id="modal-class-checkboxes" class="grid grid-cols-2 gap-2 max-h-36 overflow-y-auto p-2 bg-slate-50 border-2 border-slate-900 rounded-xl"></div>
            </div>

            <div class="flex justify-end gap-3 pt-2">
                <button onclick="closeEditStudentModal()" class="neo-btn px-4 py-2 text-xs">取消</button>
                <button onclick="saveStudentProfile()" class="neo-btn neo-btn-primary px-4 py-2 text-xs">保存更新</button>
            </div>
        </div>
    </div>

    <!-- 🏫 新建/修改班级 Modal (包含时间) -->
    <div id="class-modal" class="fixed inset-0 modal-overlay z-50 flex items-center justify-center p-4 hidden">
        <div class="neo-card bg-white max-w-md w-full p-6 space-y-4">
            <h3 class="font-fun text-xl font-bold" id="class-modal-title">班级配置</h3>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">班级代码 (Class Code)</label>
                <input type="text" id="class-code-input" class="neo-input w-full font-mono uppercase text-xs">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">班级全称</label>
                <input type="text" id="class-name-input" class="neo-input w-full text-xs" placeholder="如: 一年级华文班">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">上课星期</label>
                    <select id="class-day-select" class="neo-input w-full text-xs font-fun bg-white">
                        <option value="星期一">星期一</option>
                        <option value="星期二">星期二</option>
                        <option value="星期三">星期三</option>
                        <option value="星期四">星期四</option>
                        <option value="星期五">星期五</option>
                        <option value="星期六">星期六</option>
                        <option value="星期日">星期日</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">上课时间段</label>
                    <input type="text" id="class-time-input" class="neo-input w-full text-xs" placeholder="如: 2:00 PM - 3:30 PM">
                </div>
            </div>
            <div class="flex justify-end gap-3 pt-2">
                <button onclick="closeClassModal()" class="neo-btn px-4 py-2 text-xs">取消</button>
                <button onclick="saveClassData()" class="neo-btn neo-btn-primary px-4 py-2 text-xs">保存班级</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAqp_1JyuAtpQgJtnFRLhuVEmUIrx1YetI",
            authDomain: "my-teacher-studio.firebaseapp.com",
            projectId: "my-teacher-studio",
            storageBucket: "my-teacher-studio.firebasestorage.app",
            messagingSenderId: "82774284780",
            appId: "1:82774284780:web:e29680ea7a0e5c435ec8c9"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let allStudents = [], allClasses = [], targetStudentUid = null, editingClassCode = null;

        auth.onAuthStateChanged(async (user) => {
            if (!user) window.location.href = "index.html";
            else loadData();
        });

        async function loadData() {
            await fetchClasses();
            await fetchStudents();
            await fetchResources();
        }

        async function fetchStudents() {
            const tbody = document.getElementById('student-table-body');
            const snap = await db.collection("users").where("role", "==", "student").get();
            tbody.innerHTML = '';
            allStudents = [];

            snap.forEach(doc => {
                const s = { id: doc.id, ...doc.data() };
                allStudents.push(s);

                const classesBadge = (s.enrolledClasses || []).map(c => `<span class="bg-sky-100 text-sky-800 border border-sky-300 font-mono text-[10px] px-1.5 py-0.5 rounded font-bold">${c}</span>`).join(' ');

                tbody.innerHTML += `
                    <tr>
                        <td class="p-2.5 font-bold text-slate-800">${s.name || '未填'}</td>
                        <td class="p-2.5 font-mono text-xs text-slate-500">${s.email || '-'}</td>
                        <td class="p-2.5">${classesBadge || '无'}</td>
                        <td class="p-2.5 text-center">
                            <button onclick="openEditStudentModal('${s.id}', '${s.name || ''}')" class="neo-btn px-2.5 py-1 text-xs bg-amber-100">
                                ✏️ 改姓名与班级
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        function openEditStudentModal(uid, currentName) {
            targetStudentUid = uid;
            const student = allStudents.find(s => s.id === uid);
            document.getElementById('modal-student-name-input').value = student ? student.name : currentName;

            const container = document.getElementById('modal-class-checkboxes');
            container.innerHTML = '';
            const enrolled = (student && student.enrolledClasses) ? student.enrolledClasses : [];

            allClasses.forEach(c => {
                const checked = enrolled.includes(c.id) ? 'checked' : '';
                container.innerHTML += `
                    <label class="inline-flex items-center gap-1 p-1 bg-white border border-slate-300 rounded text-xs cursor-pointer">
                        <input type="checkbox" value="${c.id}" class="student-cls-cb" ${checked}>
                        <span class="font-mono font-bold">${c.id}</span>
                    </label>
                `;
            });

            document.getElementById('edit-student-modal').classList.remove('hidden');
        }
        function closeEditStudentModal() { document.getElementById('edit-student-modal').classList.add('hidden'); }

        async function saveStudentProfile() {
            if (!targetStudentUid) return;
            const newName = document.getElementById('modal-student-name-input').value.trim();
            const cbs = document.querySelectorAll('.student-cls-cb');
            const newClasses = [];
            cbs.forEach(cb => { if (cb.checked) newClasses.push(cb.value); });

            try {
                await db.collection("users").doc(targetStudentUid).update({
                    name: newName,
                    enrolledClasses: newClasses
                });
                closeEditStudentModal();
                fetchStudents();
            } catch (err) { alert("更新失败"); }
        }

        async function fetchClasses() {
            const container = document.getElementById('class-cards-container');
            const snap = await db.collection("classes").get();
            allClasses = [];
            container.innerHTML = '';

            snap.forEach(doc => {
                const c = { id: doc.id, ...doc.data() };
                allClasses.push(c);
                container.innerHTML += `
                    <div class="neo-card p-3.5 bg-white space-y-1">
                        <div class="flex justify-between items-center">
                            <span class="font-mono font-bold bg-amber-300 border border-slate-900 px-2 py-0.5 rounded text-xs">${c.id}</span>
                            <span class="text-xs font-bold text-slate-500">${c.scheduleDay || '星期未设'}</span>
                        </div>
                        <h4 class="font-fun font-bold text-slate-800 text-sm">${c.className || ''}</h4>
                        <p class="text-xs text-slate-500 font-mono"><i class="fa-regular fa-clock"></i> ${c.scheduleTime || '时间未设'}</p>
                    </div>
                `;
            });
        }

        function openCreateClassModal() {
            editingClassCode = null;
            document.getElementById('class-code-input').value = '';
            document.getElementById('class-name-input').value = '';
            document.getElementById('class-modal').classList.remove('hidden');
        }
        function closeClassModal() { document.getElementById('class-modal').classList.add('hidden'); }

        async function saveClassData() {
            const code = document.getElementById('class-code-input').value.trim().toUpperCase();
            const name = document.getElementById('class-name-input').value.trim();
            const day = document.getElementById('class-day-select').value;
            const time = document.getElementById('class-time-input').value.trim();

            if (!code || !name) return alert("请填写代码与名称");

            try {
                await db.collection("classes").doc(code).set({
                    className: name,
                    scheduleDay: day,
                    scheduleTime: time || "14:00 - 15:30"
                }, { merge: true });

                closeClassModal();
                fetchClasses();
            } catch (e) { alert("保存失败"); }
        }

        async function fetchResources() {
            const tbody = document.getElementById('resource-table-body');
            const snap = await db.collection("resources").get();
            tbody.innerHTML = '';
            snap.forEach(doc => {
                const r = doc.data();
                tbody.innerHTML += `
                    <tr>
                        <td class="p-2.5 font-bold">${r.title}</td>
                        <td class="p-2.5 text-xs text-slate-500">${r.subject} / U${r.unit}</td>
                        <td class="p-2.5 text-xs font-mono font-bold">${(r.unlockedClasses || []).join(', ') || '未开放'}</td>
                    </tr>
                `;
            });
        }

        function switchTab(t) {
            ['students', 'classes', 'unlock'].forEach(tab => {
                document.getElementById(`tab-${tab}`).classList.toggle('active', tab === t);
                document.getElementById(`section-${tab}`).classList.toggle('hidden', tab !== t);
            });
        }
    </script>
</body>
</html>
