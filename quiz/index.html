<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Game</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- 引入 FontAwesome 图标库 (可选) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="container">

    <!-- 顶栏：显示当前登录的学生姓名 -->
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: rgba(0,0,0,0.05); border-radius: 10px; margin-bottom: 15px;">
        <div style="font-weight: bold; color: #333;">
            👤 当前做题学生: <span id="header-user-name" style="color: #2196F3;">检查登录中...</span>
        </div>
        <a href="../dashboard.html" style="text-decoration: none; font-weight: bold; color: #666; font-size: 14px;">🏠 返回主页</a>
    </div>

    <!-- Start Screen (游戏开始界面) -->
    <section id="start-screen" class="screen">
        <h1>Quiz Game</h1>
        <p id="total-question-text"></p>

        <button id="start-btn">Start Game</button>

        <!-- 首页排行榜列表 -->
        <div style="margin-top: 30px;">
            <h3>🏆 排行榜 Top 10</h3>
            <ol id="leaderboard-list" style="padding-left: 20px; margin-top: 10px; text-align: left;"></ol>
        </div>
    </section>

    <!-- Quiz Screen (做题界面) -->
    <section id="quiz-screen" class="screen hidden">
        <div class="top-bar">
            <div id="question-number"></div>
            <div id="score"></div>
            <div id="timer"></div>
        </div>
        <div class="question-box">
            <h2 id="question" style="font-size: 36px; text-align: center;"></h2>
        </div>
        <div id="options"></div>
    </section>

    <!-- Result Screen (结算界面) -->
    <section id="result-screen" class="screen hidden">
        <h1>Game Over</h1>
        <h2 id="final-score"></h2>
        <h3 id="final-time"></h3>

    <!-- Start Screen (游戏开始界面) -->
    <section id="start-screen" class="screen">
        <h1>Quiz Game</h1>
        <p id="total-question-text"></p>

        <button id="start-btn">Start Game</button>

        <!-- 首页排行榜列表 (添加 class="leaderboard-list" 保持统一) -->
        <div style="margin-top: 30px;">
            <h3>🏆 排行榜 Top 10</h3>
            <ol id="leaderboard-list" class="leaderboard-list" style="padding-left: 20px; margin-top: 10px; text-align: left;"></ol>
        </div>
    </section>
</div>

<!-- 1. 引入 Firebase SDK (Compat 兼容版) -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
    // =========================================================
    // ⚠️ 步骤：请把你在 index.html 用过的 Firebase 配置原封不动复制到这里
    // =========================================================
    const firebaseConfig = {
        apiKey: "AIzaSyAqp_1JyuAtpQgJtnFRLhuVEmUIrx1YetI",
        authDomain: "my-teacher-studio.firebaseapp.com",
        projectId: "my-teacher-studio",
        storageBucket: "my-teacher-studio.firebasestorage.app",
        messagingSenderId: "82774284780",
        appId: "1:82774284780:web:e29680ea7a0e5c435ec8c9"
    };

    // 初始化 Firebase
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let hasSavedScoreThisRound = false; // 防止重复提交标记

    // 2. 登录状态监听 (进入页面时自动验证身份)
    auth.onAuthStateChanged((user) => {
        if (user) {
            currentUser = user;
            const displayName = user.displayName || user.email.split('@')[0] || "匿名学生";
            
            // 在页面顶部显示名字
            const headerNameEl = document.getElementById('header-user-name');
            if (headerNameEl) headerNameEl.innerText = displayName;

            // 加载排行榜
            loadLeaderboard();
        } else {
            // 如果没登录，弹窗并自动跳转回登录页
            alert("请先登录账号再开始做题！");
            window.location.href = "../index.html";
        }
    });

    // 3. 自动保存成绩到 Firestore
async function autoSaveScore() {
        if (!currentUser) return;
        if (hasSavedScoreThisRound) return; // 本轮已保存过则跳过

        // ⏳ 稍微延迟 300ms，确保 script.js 已经把分数和时间填入了 #final-score / #final-time 元素中
        await new Promise(resolve => setTimeout(resolve, 300));

        const statusBox = document.getElementById('save-status-box');
        const displayName = currentUser.displayName || currentUser.email.split('@')[0] || "匿名学生";

        // 提取最终得分
        const scoreEl = document.getElementById('final-score');
        const scoreText = scoreEl ? scoreEl.innerText : "";
        const scoreMatch = scoreText.match(/\d+/); 
        const scoreValue = scoreMatch ? parseInt(scoreMatch[0]) : 0;

        // 提取完成时间
        const timeEl = document.getElementById('final-time');
        const timeText = timeEl ? timeEl.innerText : "";

        try {
            if (statusBox) statusBox.innerHTML = `⏳ 正在保存 ${displayName} 的成绩...`;

            await db.collection("leaderboard").add({
                uid: currentUser.uid,
                playerName: displayName,
                score: scoreValue,
                timeText: timeText,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            hasSavedScoreThisRound = true; // 标记已提交
            if (statusBox) {
                statusBox.style.background = '#e8f5e9';
                statusBox.style.color = '#2e7d32';
                statusBox.innerHTML = `🎉 成绩已自动为 <b>${displayName}</b> 成功保存！`;
            }

            // 重新刷新排行榜
            loadLeaderboard();

        } catch (err) {
            console.error("保存成绩失败:", err);
            if (statusBox) {
                statusBox.style.background = '#ffebee';
                statusBox.style.color = '#c62828';
                statusBox.innerHTML = `⚠️ 成绩保存失败: ${err.message || '权限不足或网络异常'}`;
            }
        }
    }

    // 4. 从 Firestore 读取排行榜 Top 10
 async function loadLeaderboard() {
        // 兼容选取 class 或 id
        const listEls = document.querySelectorAll('.leaderboard-list, #leaderboard-list');
        if (!listEls.length) return;

        try {
            const snapshot = await db.collection("leaderboard")
                .orderBy("score", "desc")
                .limit(10)
                .get();

            listEls.forEach(el => el.innerHTML = "");

            if (snapshot.empty) {
                listEls.forEach(el => el.innerHTML = "<li style='color:#666;'>暂无成绩记录，快来成为第一名吧！</li>");
                return;
            }

            snapshot.forEach((doc) => {
                const data = doc.data();
                listEls.forEach(el => {
                    const li = document.createElement('li');
                    li.style.marginBottom = "6px";
                    li.innerHTML = `<b>${data.playerName || '匿名'}</b> - 分数: <span style="color:#e91e63; font-weight:bold;">${data.score}</span> (${data.timeText || ''})`;
                    el.appendChild(li);
                });
            });
        } catch (err) {
            console.error("加载排行榜失败:", err);
            listEls.forEach(el => el.innerHTML = `<li style="color:#c62828;">⚠️ 加载排行榜失败: ${err.message}</li>`);
        }
    }
    
    // 5. 监听 Result Screen（游戏结束）事件，一旦展示即触发自动保存
    const observer = new MutationObserver(() => {
        const resultScreen = document.getElementById('result-screen');
        if (resultScreen && !resultScreen.classList.contains('hidden')) {
            autoSaveScore();
        }
    });

    window.addEventListener('DOMContentLoaded', () => {
        const resultScreen = document.getElementById('result-screen');
        if (resultScreen) {
            observer.observe(resultScreen, { attributes: true, attributeFilter: ['class'] });
        }

        // 重新开始按钮点击时重置提交标记
        const restartBtn = document.getElementById('restart-btn');
        if (restartBtn) {
            restartBtn.addEventListener('click', () => {
                hasSavedScoreThisRound = false;
                const statusBox = document.getElementById('save-status-box');
                if (statusBox) {
                    statusBox.style.background = '#e3f2fd';
                    statusBox.style.color = '#0d47a1';
                    statusBox.innerHTML = `⏳ 正在自动提交成绩中，请稍候...`;
                }
            });
        }
    });
</script>

<!-- 6. 引入您原本的题目和游戏逻辑脚本 -->
<script src="lesson1.js"></script>
<script src="script.js"></script>

</body>
</html>
