<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

    <!-- Start Screen -->
    <section id="start-screen" class="screen">
        <h1>Quiz Game</h1>
        <p id="total-question-text"></p>

        <button id="start-btn">Start</button>

        <!-- 首页排行榜列表 -->
        <div style="margin-top: 30px;">
            <h3>🏆 排行榜 Top 10</h3>
            <ol id="leaderboard-list" style="padding-left: 20px; margin-top: 10px;"></ol>
        </div>
    </section>

    <!-- Quiz Screen -->
    <section id="quiz-screen" class="screen hidden">
        <div class="top-bar">
            <div id="question-number"></div>
            <div id="score"></div>
            <div id="timer"></div>
        </div>
        <div class="question-box">
            <h2 id="question" style="font-size: 36px; text-align: center;"></h2>
        </div>
        <div id="options"></div>
    </section>

    <!-- Result Screen -->
    <section id="result-screen" class="screen hidden">
        <h1>Game Over</h1>
        <h2 id="final-score"></h2>
        <h3 id="final-time"></h3>

        <!-- 成绩提交表单 -->
        <div style="text-align: center; margin: 20px 0;">
            <input type="text" id="player-name" placeholder="输入你的名字" style="padding: 10px; font-size: 16px; border-radius: 8px; border: 1px solid #ccc;">
            <button id="save-score-btn" style="padding: 10px 20px; font-size: 16px; background: #2196F3; color: white; border-radius: 8px; margin-left: 10px;">保存成绩</button>
        </div>

        <button id="restart-btn">Play Again</button>
    </section>

</div>

<script src="lesson1.js"></script>
<script src="script.js"></script>
</body>
</html>
