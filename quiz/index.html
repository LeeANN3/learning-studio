<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Game</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- 引入 FontAwesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="container">

    <!-- 顶栏：显示当前登录的学生姓名 -->
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: rgba(0,0,0,0.05); border-radius: 10px; margin-bottom: 15px;">
        <div style="font-weight: bold; color: #333;">
            👤 当前做题学生: <span id="header-user-name" style="color: #2196F3;">检查登录中...</span>
        </div>
        <a href="../dashboard.html" style="text-decoration: none; font-weight: bold; color: #666; font-size: 14px;">🏠 返回主页</a>
    </div>

    <!-- Start Screen (游戏开始界面) -->
    <section id="start-screen" class="screen">
        <h1>Quiz Game</h1>
        <p id="total-question-text"></p>

        <button id="start-btn">Start Game</button>

        <!-- 游戏前排行榜 -->
        <div style="margin-top: 30px;">
            <h3>🏆 排行榜 Top 10</h3>
            <ol class="leaderboard-list" style="padding-left: 20px; margin-top: 10px; text-align: left;"></ol>
        </div>
    </section>

    <!-- Quiz Screen (做题界面) -->
    <section id="quiz-screen" class="screen hidden">
        <div class="top-bar">
            <div id="question-number"></div>
            <div id="score"></div>
            <div id="timer"></div>
        </div>
        <div class="question-box">
            <h2 id="question" style="font-size: 36px; text-align: center;"></h2>
        </div>
        <div id="options"></div>
    </section>

    <!-- Result Screen (结算界面) -->
    <section id="result-screen" class="screen hidden">
        <h1>Game Over</h1>
        <h2 id="final-score"></h2>
        <h3 id="final-time"></h3>
        
        <!-- 自动保存状态提示框 -->
        <div id="save-status-box" style="margin: 15px 0; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 14px; background: #e3f2fd; color: #0d47a1;">
            ⏳ 正在自动提交成绩中，请稍候...
        </div>

        <button id="restart-btn" style="margin-top: 10px;">再玩一次</button>

        <!-- 👈 游戏后排行榜 (新增) -->
        <div style="margin-top: 30px; border-top: 1px solid #eee; padding-top: 15px;">
            <h3>🏆 最新排行榜 Top 10</h3>
            <ol class="leaderboard-list" style="padding-left: 20px; margin-top: 10px; text-align: left;"></ol>
        </div>
    </section>
</div>

<!-- 1. 引入 Firebase SDK (Compat 兼容版) -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
    // 初始化 Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyAqp_1JyuAtpQgJtnFRLhuVEmUIrx1YetI",
        authDomain: "my-teacher-studio.firebaseapp.com",
        projectId: "my-teacher-studio",
        storageBucket: "my-teacher-studio.firebasestorage.app",
        messagingSenderId: "82774284780",
        appId: "1:82774284780:web:e29680ea7a0e5c435ec8c9"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let currentUserProfile = null; // 存储学生的详细 Profile 数据 (包含班级)
    let hasSavedScoreThisRound = false; // 防止重复提交标记

    // 2. 登录状态监听 (进入页面时自动验证身份并获取班级)
    auth.onAuthStateChanged(async (user) => {
        if (user) {
            currentUser = user;
            try {
                // 实时从 users 集合获取当前学生的班级数据
                const userDoc = await db.collection("users").doc(user.uid).get();
                if (userDoc.exists) {
                    currentUserProfile = userDoc.data();
                }
            } catch (err) {
                console.error("读取学生详细 Profile 失败:", err);
            }

            const displayName = (currentUserProfile && currentUserProfile.name) || user.displayName || user.email.split('@')[0] || "未命名学生";
            
            // 在页面顶部显示名字
            const headerNameEl = document.getElementById('header-user-name');
            if (headerNameEl) headerNameEl.innerText = displayName;

            // 加载云端排行榜
            loadLeaderboard();
        } else {
            alert("请先登录账号再开始做题！");
            window.location.href = "../index.html";
        }
    });

    // 3. 自动保存成绩到 Firestore (补齐班级和多维分类数据)
    async function autoSaveScore() {
        if (!currentUser) return;
        if (hasSavedScoreThisRound) return; // 本轮已保存过则跳过

        // 稍微延迟 300ms，确保 script.js 已经把分数和时间填入了 #final-score / #final-time
        await new Promise(resolve => setTimeout(resolve, 300));

        const statusBox = document.getElementById('save-status-box');
        const displayName = (currentUserProfile && currentUserProfile.name) || currentUser.displayName || "未命名学生";

        // 获取学生的第一个班级 Code
        const studentClassCode = (currentUserProfile && currentUserProfile.enrolledClasses && currentUserProfile.enrolledClasses.length > 0)
            ? currentUserProfile.enrolledClasses[0]
            : "未划分班级";

        // 提取最终得分
        const scoreEl = document.getElementById('final-score');
        const scoreText = scoreEl ? scoreEl.innerText : "";
        const scoreMatch = scoreText.match(/\d+/); 
        const scoreValue = scoreMatch ? parseInt(scoreMatch[0]) : 0;

        // 提取完成时间
        const timeEl = document.getElementById('final-time');
        const timeText = timeEl ? timeEl.innerText : "";
        const timeMatch = timeText.match(/\d+/);
        const secondsValue = timeMatch ? parseInt(timeMatch[0]) : 0;

        // 格式化时间显示 (如 80 秒 -> "01:20")
        const mins = Math.floor(secondsValue / 60).toString().padStart(2, '0');
        const secs = (secondsValue % 60).toString().padStart(2, '0');
        const formattedTimeText = `${mins}:${secs}`;

        // 安全的全局 wrongCount 获取
        const wrongAnswers = (typeof window.wrongCount !== 'undefined') ? window.wrongCount : 0;

        try {
            if (statusBox) statusBox.innerHTML = `⏳ 正在自动提交 ${displayName} 的成绩...`;

            // 查询该学生此前提交过多少次本测验，自动计算尝试次数
            const quizId = (typeof QUIZ_INFO !== 'undefined' && QUIZ_INFO.quizId) ? QUIZ_INFO.quizId : "testing_quiz_01";
            const existingSnap = await db.collection("leaderboard")
                .where("studentUid", "==", currentUser.uid)
                .where("quizId", "==", quizId)
                .get();

            const attemptsCount = existingSnap.size + 1;

            // 写入完整的 leaderboard 集合数据
            await db.collection("leaderboard").add({
                studentUid: currentUser.uid,
                playerName: displayName,
                classCode: studentClassCode,

                quizId: quizId,
                quizTitle: (typeof QUIZ_INFO !== 'undefined' && QUIZ_INFO.quizTitle) ? QUIZ_INFO.quizTitle : "testing quiz",
                subject: (typeof QUIZ_INFO !== 'undefined' && QUIZ_INFO.subject) ? QUIZ_INFO.subject : "chinese",
                grade: (typeof QUIZ_INFO !== 'undefined' && QUIZ_INFO.grade) ? QUIZ_INFO.grade : 1,
                unit: (typeof QUIZ_INFO !== 'undefined' && QUIZ_INFO.unit) ? QUIZ_INFO.unit : 1,

                score: scoreValue,
                timeSpent: secondsValue,
                timeText: formattedTimeText,
                attemptsCount: attemptsCount,
                wrongAnswersCount: wrongAnswers,

                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                status: "active"
            });

            hasSavedScoreThisRound = true; // 标记已提交
            if (statusBox) {
                statusBox.style.background = '#e8f5e9';
                statusBox.style.color = '#2e7d32';
                statusBox.innerHTML = `🎉 成绩已自动为 <b>${displayName} (${studentClassCode})</b> 成功同步到教师后台！`;
            }

            // 重新刷新首页与结算页的所有排行榜
            loadLeaderboard();

        } catch (err) {
            console.error("保存成绩失败:", err);
            if (statusBox) {
                statusBox.style.background = '#ffebee';
                statusBox.style.color = '#c62828';
                statusBox.innerHTML = `⚠️ 成绩保存失败: ${err.message || '网络异常'}`;
            }
        }
    }

    // 4. 从 Firestore 读取排行榜 Top 10 (同时刷新首页和结算界面的排行榜)
    async function loadLeaderboard() {
        const listEls = document.querySelectorAll('.leaderboard-list');
        if (!listEls.length) return;

        // 开启加载提示
        listEls.forEach(el => el.innerHTML = "<li style='color:#888;'>⏳ 正在读取云端排行榜...</li>");

        const currentQuizId = (typeof QUIZ_INFO !== 'undefined' && QUIZ_INFO.quizId) ? QUIZ_INFO.quizId : "testing_quiz_01";

        try {
            const snapshot = await db.collection("leaderboard")
                .where("quizId", "==", currentQuizId)
                .orderBy("score", "desc")
                .limit(10)
                .get();

            listEls.forEach(el => el.innerHTML = "");

            if (snapshot.empty) {
                listEls.forEach(el => el.innerHTML = "<li style='color:#666;'>暂无成绩记录，快来抢占第一名吧！</li>");
                return;
            }

            // 动态构建列表内容
            listEls.forEach(el => {
                let rank = 1;
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.status === "pending_delete") return;

                    const li = document.createElement('li');
                    li.style.marginBottom = "6px";
                    const timeDisp = data.timeText || (data.timeSpent ? `${data.timeSpent}秒` : '');
                    li.innerHTML = `<b>#${rank} ${data.playerName || '匿名'}</b> <span style="color:#666; font-size:12px;">(${data.classCode || '无班级'})</span> - 得分: <span style="color:#e91e63; font-weight:bold;">${data.score}</span> ${timeDisp ? `(${timeDisp})` : ''}`;
                    el.appendChild(li);
                    rank++;
                });
            });
        } catch (err) {
            console.error("加载排行榜失败:", err);
            
            if (err.message && err.message.includes("index")) {
                listEls.forEach(el => el.innerHTML = `<li style="color:#f57c00; font-size:13px;">⚠️ 数据库复合索引生成中 (需1-2分钟)，请稍后刷新...</li>`);
            } else {
                listEls.forEach(el => el.innerHTML = `<li style="color:#c62828; font-size:13px;">⚠️ 加载排行榜失败: ${err.message}</li>`);
            }
        }
    }

    // 5. 监听 Result Screen 展示，自动保存成绩并加载排行榜
    const observer = new MutationObserver(() => {
        const resultScreen = document.getElementById('result-screen');
        if (resultScreen && !resultScreen.classList.contains('hidden')) {
            autoSaveScore();
        }
    });

    window.addEventListener('DOMContentLoaded', () => {
        const resultScreen = document.getElementById('result-screen');
        if (resultScreen) {
            observer.observe(resultScreen, { attributes: true, attributeFilter: ['class'] });
        }

        const restartBtn = document.getElementById('restart-btn');
        if (restartBtn) {
            restartBtn.addEventListener('click', () => {
                hasSavedScoreThisRound = false;
                const statusBox = document.getElementById('save-status-box');
                if (statusBox) {
                    statusBox.style.background = '#e3f2fd';
                    statusBox.style.color = '#0d47a1';
                    statusBox.innerHTML = `⏳ 正在自动提交成绩中，请稍候...`;
                }
            });
        }
    });
</script>

<!-- 6. 引入题目与游戏逻辑脚本 -->
<script src="lesson1.js"></script>
<script src="script.js"></script>

</body>
</html>
