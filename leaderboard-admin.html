<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班级做题成绩与答题分析榜 - Fun Learning Island</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Patrick+Hand&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            font-family: 'Patrick Hand', 'ZCOOL KuaiLe', cursive, sans-serif;
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
            background-size: 20px 20px;
            min-height: 100vh;
            color: #0f172a;
        }
        .font-fun { font-family: 'Fredoka', 'ZCOOL KuaiLe', cursive; }
        .neo-card {
            background-color: #ffffff;
            border: 2px solid #0f172a;
            border-radius: 16px;
            box-shadow: 4px 4px 0px #0f172a;
        }
        .neo-btn {
            background-color: #ffffff;
            border: 2px solid #0f172a;
            border-radius: 12px;
            box-shadow: 2px 2px 0px #0f172a;
            transition: all 0.15s ease;
            font-family: 'Fredoka', 'ZCOOL KuaiLe', cursive;
            font-weight: 600;
        }
        .neo-btn:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0px #0f172a; }
        .neo-btn-primary { background-color: #ffe600; }
        .neo-btn-danger { background-color: #fee2e2; color: #dc2626; border-color: #dc2626; box-shadow: 2px 2px 0px #dc2626; }
        .neo-input { border: 2px solid #0f172a; border-radius: 10px; outline: none; padding: 8px 12px; box-shadow: 2px 2px 0px #cbd5e1; }
        .modal-overlay { background-color: rgba(15, 23, 42, 0.6); backdrop-filter: blur(2px); }
    </style>
</head>
<body class="pb-10">

    <!-- Responsive Top Nav -->
    <nav class="bg-white border-b-2 border-slate-900 sticky top-0 z-40 px-3 sm:px-6 py-2.5 shadow-[0_4px_0_#0f172a]">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-amber-300 p-2 rounded-xl border-2 border-slate-900 shadow-[2px_2px_0_#0f172a]">
                    <i class="fa-solid fa-trophy text-lg sm:text-xl text-amber-800"></i>
                </div>
                <div>
                    <h1 class="font-fun text-lg sm:text-xl font-bold leading-tight">班级做题成绩与答题分析榜</h1>
                    <p class="text-[10px] sm:text-xs text-slate-500 font-sans">Class Leaderboard & Game Analytics</p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <a href="admin.html" class="neo-btn px-3 py-1.5 text-xs sm:text-sm flex items-center gap-1.5 bg-slate-100">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>返回教室后台</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 mt-6">
        
        <!-- 🎯 控制栏：班级 -> 科目 -> 单元级联筛选 -->
        <div class="neo-card p-4 sm:p-5 mb-6 bg-amber-100/60">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 mb-3">
                <h3 class="font-fun text-lg sm:text-xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-filter text-amber-600"></i>
                    <span>班级与课程单元筛选</span>
                </h3>
                <span class="text-xs text-slate-500 font-bold">按测验/游戏卡片分组展示成绩</span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 lg:grid-cols-4 gap-3">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">1. 目标班级 (Class)</label>
                    <select id="select-class-code" onchange="loadLeaderboardCards()" class="neo-input w-full bg-white text-xs sm:text-sm font-fun">
                        <option value="ALL">全部班级 (All Classes)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">2. 课程科目 (Subject)</label>
                    <select id="select-subject" onchange="loadLeaderboardCards()" class="neo-input w-full bg-white text-xs sm:text-sm font-fun">
                        <option value="ALL">全部科目 (All Subjects)</option>
                        <option value="chinese">华文</option>
                        <option value="malay">马来文</option>
                        <option value="english">英文</option>
                        <option value="math">数学</option>
                        <option value="science">科学</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">3. 课程单元 (Unit)</label>
                    <select id="select-unit" onchange="loadLeaderboardCards()" class="neo-input w-full bg-white text-xs sm:text-sm font-fun">
                        <option value="ALL">全部单元 (All Units)</option>
                        <!-- 动态生成 1 - 20 单元 -->
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">4. 搜索测验/游戏名称</label>
                    <div class="relative">
                        <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="input-search" onkeyup="loadLeaderboardCards()" placeholder="输入测验名称..." class="neo-input w-full pl-9 text-xs sm:text-sm">
                    </div>
                </div>
            </div>
        </div>

        <!-- 🃏 卡片式榜单网格容器 -->
        <div id="cards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            <div class="col-span-full p-12 text-center neo-card bg-white font-fun text-slate-400">
                <i class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-amber-500"></i><br>正在为您加载班级游戏榜单...
            </div>
        </div>

    </div>

    <!-- ✏️ 编辑成绩 Modal -->
    <div id="edit-score-modal" class="fixed inset-0 modal-overlay z-50 flex items-center justify-center p-4 hidden">
        <div class="neo-card bg-white max-w-md w-full p-6 space-y-4">
            <h3 class="font-fun text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-pen-to-square text-amber-500"></i>
                <span>修正学生测验成绩记录</span>
            </h3>

            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">做题学生</label>
                <p id="modal-score-student-name" class="font-bold text-sm bg-slate-100 p-2.5 rounded-lg border border-slate-300"></p>
            </div>

            <div class="grid grid-cols-3 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">最终得分</label>
                    <input type="number" id="modal-score-input" class="neo-input w-full text-xs font-bold text-red-600">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">尝试次数</label>
                    <input type="number" id="modal-attempts-input" class="neo-input w-full text-xs font-bold text-amber-600">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">错题数</label>
                    <input type="number" id="modal-wrongs-input" class="neo-input w-full text-xs font-bold text-sky-600">
                </div>
            </div>

            <div class="flex justify-end gap-3 pt-2">
                <button onclick="closeEditScoreModal()" class="neo-btn px-4 py-2 text-xs sm:text-sm">取消</button>
                <button onclick="saveScoreRecord()" class="neo-btn neo-btn-primary px-4 py-2 text-xs sm:text-sm">保存更新</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAqp_1JyuAtpQgJtnFRLhuVEmUIrx1YetI",
            authDomain: "my-teacher-studio.firebaseapp.com",
            projectId: "my-teacher-studio",
            storageBucket: "my-teacher-studio.firebasestorage.app",
            messagingSenderId: "82774284780",
            appId: "1:82774284780:web:e29680ea7a0e5c435ec8c9"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let rawLeaderboardData = [];
        let scoreTargetToEdit = null;

        auth.onAuthStateChanged(async (user) => {
            if (!user) { window.location.href = "index.html"; return; }
            try {
                const userDoc = await db.collection("users").doc(user.uid).get();
                if (userDoc.exists && userDoc.data().role === 'teacher') {
                    initUnitOptions();
                    await fetchClassOptions();
                    await fetchAllScores();
                } else {
                    window.location.href = "dashboard.html";
                }
            } catch (err) { window.location.href = "index.html"; }
        });

        function initUnitOptions() {
            const select = document.getElementById('select-unit');
            for (let i = 1; i <= 20; i++) {
                select.innerHTML += `<option value="${i}">单元 ${i}</option>`;
            }
        }

        async function fetchClassOptions() {
            const select = document.getElementById('select-class-code');
            try {
                const snapshot = await db.collection("classes").get();
                snapshot.forEach(doc => {
                    const c = doc.data();
                    select.innerHTML += `<option value="${doc.id}">${doc.id} - ${c.className || ''}</option>`;
                });
            } catch (err) {}
        }

        async function fetchAllScores() {
            try {
                const snapshot = await db.collection("leaderboard").get();
                rawLeaderboardData = [];
                snapshot.forEach(doc => rawLeaderboardData.push({ id: doc.id, ...doc.data() }));
                loadLeaderboardCards();
            } catch (err) {
                document.getElementById('cards-container').innerHTML = `
                    <div class="col-span-full p-8 text-center neo-card text-red-500 font-bold">
                        读取成绩榜单失败：${err.message}
                    </div>`;
            }
        }

        // 🌟 核心突破：将测验/游戏按卡片 (Card) 进行分组渲染
        function loadLeaderboardCards() {
            const container = document.getElementById('cards-container');
            const classFilter = document.getElementById('select-class-code').value;
            const subjectFilter = document.getElementById('select-subject').value;
            const unitFilter = document.getElementById('select-unit').value;
            const searchFilter = document.getElementById('input-search').value.toLowerCase().trim();

            // 1. 过滤符合条件的原始成绩
            const filteredScores = rawLeaderboardData.filter(item => {
                if (item.status === 'pending_delete') return false;
                const matchClass = (classFilter === 'ALL') || (item.classCode === classFilter);
                const matchSubject = (subjectFilter === 'ALL') || (item.subject === subjectFilter);
                const matchUnit = (unitFilter === 'ALL') || (item.unit == unitFilter);
                const matchSearch = (item.quizTitle || item.quizId || '').toLowerCase().includes(searchFilter);
                return matchClass && matchSubject && matchUnit && matchSearch;
            });

            // 2. 按 quizId/quizTitle 进行卡片分组 (Group By Quiz/Game)
            const groupedGames = {};
            filteredScores.forEach(score => {
                const quizKey = score.quizId || score.quizTitle || '通用练习';
                if (!groupedGames[quizKey]) {
                    groupedGames[quizKey] = {
                        quizTitle: score.quizTitle || score.quizId || '未知测验',
                        subject: score.subject || '',
                        unit: score.unit || 1,
                        scores: []
                    };
                }
                groupedGames[quizKey].scores.push(score);
            });

            const keys = Object.keys(groupedGames);
            container.innerHTML = '';

            if (keys.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full p-12 text-center neo-card bg-white font-fun text-slate-400">
                        <i class="fa-solid fa-ghost text-4xl mb-2"></i><br>该班级/单元暂无任何测验做题记录
                    </div>`;
                return;
            }

            const subjectNames = { chinese: '华文', malay: '马来文', english: '英文', math: '数学', science: '科学' };

            // 3. 逐个渲染测验/游戏卡片
            keys.forEach(key => {
                const game = groupedGames[key];
                
                // 排序该游戏下的做题成绩 (分数高者优先，用时短者优先)
                game.scores.sort((a, b) => (b.score !== a.score) ? b.score - a.score : (a.timeSpent || 9999) - (b.timeSpent || 9999));

                const card = document.createElement('div');
                card.className = "neo-card bg-white p-4 flex flex-col justify-between hover:shadow-[6px_6px_0_#0f172a] transition-all";

                let rankingListHTML = '';
                game.scores.forEach((r, idx) => {
                    let medal = `<span class="font-mono text-xs text-slate-400">#${idx + 1}</span>`;
                    if (idx === 0) medal = `🥇`;
                    else if (idx === 1) medal = `🥈`;
                    else if (idx === 2) medal = `🥉`;

                    const attempts = r.attemptsCount || 1;
                    const wrongs = (r.wrongAnswersCount !== undefined) ? r.wrongAnswersCount : 0;

                    rankingListHTML += `
                        <div class="flex items-center justify-between p-2 rounded-lg bg-slate-50 border border-slate-200 text-xs hover:bg-amber-50">
                            <div class="flex items-center gap-2">
                                <span class="w-5 text-center">${medal}</span>
                                <div>
                                    <div class="font-bold text-slate-800">${r.playerName || '匿名'}</div>
                                    <div class="text-[10px] text-slate-400 font-mono">${r.classCode || ''}</div>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="font-bold text-red-600 text-sm">${r.score} <span class="text-[10px] text-slate-500">分</span></div>
                                <div class="text-[10px] text-slate-400">第 ${attempts} 次 · 错 ${wrongs} 题</div>
                            </div>
                            <div class="flex items-center gap-1 ml-1">
                                <button onclick="openEditScoreModal('${r.id}', '${r.playerName || '学生'}', ${r.score}, ${attempts}, ${wrongs})" class="text-slate-400 hover:text-amber-600 p-1"><i class="fa-solid fa-pen-to-square"></i></button>
                                <button onclick="deleteSingleScoreRecord('${r.id}')" class="text-slate-400 hover:text-red-600 p-1"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div>
                        <!-- 卡片 Header -->
                        <div class="flex justify-between items-start border-b-2 border-slate-900 pb-2.5 mb-3">
                            <div>
                                <span class="bg-amber-300 border border-slate-900 px-2 py-0.5 rounded text-[10px] font-bold font-mono">
                                    ${subjectNames[game.subject] || game.subject} · U${game.unit}
                                </span>
                                <h4 class="font-fun text-base font-bold text-slate-900 mt-1">${game.quizTitle}</h4>
                            </div>
                            <button onclick="clearSingleQuizScores('${key}', '${game.quizTitle}')" class="neo-btn neo-btn-danger px-2 py-1 text-[10px] flex items-center gap-1" title="清空该测验所有成绩">
                                <i class="fa-solid fa-broom"></i> 清空
                            </button>
                        </div>

                        <!-- 榜单人员列表 -->
                        <div class="space-y-1.5 max-h-60 overflow-y-auto pr-1">
                            ${rankingListHTML}
                        </div>
                    </div>

                    <div class="mt-3 pt-2 border-t border-slate-200 text-right text-[11px] font-bold text-slate-500">
                        共 ${game.scores.length} 人提交练习
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // --- 编辑与修改得分记录 ---
        function openEditScoreModal(docId, name, score, attempts, wrongs) {
            scoreTargetToEdit = docId;
            document.getElementById('modal-score-student-name').innerText = name;
            document.getElementById('modal-score-input').value = score;
            document.getElementById('modal-attempts-input').value = attempts;
            document.getElementById('modal-wrongs-input').value = wrongs;
            document.getElementById('edit-score-modal').classList.remove('hidden');
        }

        function closeEditScoreModal() {
            scoreTargetToEdit = null;
            document.getElementById('edit-score-modal').classList.add('hidden');
        }

        async function saveScoreRecord() {
            if (!scoreTargetToEdit) return;
            try {
                await db.collection("leaderboard").doc(scoreTargetToEdit).update({
                    score: parseInt(document.getElementById('modal-score-input').value) || 0,
                    attemptsCount: parseInt(document.getElementById('modal-attempts-input').value) || 1,
                    wrongAnswersCount: parseInt(document.getElementById('modal-wrongs-input').value) || 0
                });
                closeEditScoreModal();
                fetchAllScores();
            } catch (err) { alert("修改失败：" + err.message); }
        }

        async function deleteSingleScoreRecord(docId) {
            if (!confirm("确认彻底删除此条成绩记录？")) return;
            try {
                await db.collection("leaderboard").doc(docId).delete();
                fetchAllScores();
            } catch (err) { alert("删除失败"); }
        }

        // 🌟 一键清空特定测验的所有做题记录
        async function clearSingleQuizScores(quizKey, quizTitle) {
            if (!confirm(`⚠️ 确认彻底抹除「${quizTitle}」的所有学生做题与得分记录吗？`)) return;
            try {
                const snapshot = await db.collection("leaderboard").get();
                const batch = db.batch();
                let count = 0;

                snapshot.forEach(doc => {
                    const data = doc.data();
                    if ((data.quizId || data.quizTitle || '') === quizKey) {
                        batch.delete(doc.ref);
                        count++;
                    }
                });

                if (count > 0) await batch.commit();
                alert(`🎉 已成功清空 ${count} 条做题记录！`);
                fetchAllScores();
            } catch (err) { alert("清空记录失败：" + err.message); }
        }
    </script>
</body>
</html>
