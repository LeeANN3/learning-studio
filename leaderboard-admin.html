<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>做题成绩与答题分析榜 - Fun Learning Island</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Patrick+Hand&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            font-family: 'Patrick Hand', 'ZCOOL KuaiLe', cursive, sans-serif;
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
            background-size: 20px 20px;
            min-height: 100vh;
            color: #0f172a;
        }
        .font-fun { font-family: 'Fredoka', 'ZCOOL KuaiLe', cursive; }
        .neo-card {
            background-color: #ffffff;
            border: 2px solid #0f172a;
            border-radius: 16px;
            box-shadow: 4px 4px 0px #0f172a;
        }
        .neo-btn {
            background-color: #ffffff;
            border: 2px solid #0f172a;
            border-radius: 12px;
            box-shadow: 2px 2px 0px #0f172a;
            transition: all 0.15s ease;
            font-family: 'Fredoka', 'ZCOOL KuaiLe', cursive;
            font-weight: 600;
        }
        .neo-btn:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0px #0f172a; }
        .neo-btn-primary { background-color: #ffe600; }
        .neo-btn-danger { background-color: #fee2e2; color: #dc2626; border-color: #dc2626; box-shadow: 2px 2px 0px #dc2626; }
        .neo-input { border: 2px solid #0f172a; border-radius: 10px; outline: none; padding: 8px 12px; box-shadow: 2px 2px 0px #cbd5e1; }
        .modal-overlay { background-color: rgba(15, 23, 42, 0.6); backdrop-filter: blur(2px); }
    </style>
</head>
<body class="pb-10">

    <!-- Responsive Top Nav -->
    <nav class="bg-white border-b-2 border-slate-900 sticky top-0 z-40 px-3 sm:px-6 py-2.5 shadow-[0_4px_0_#0f172a]">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-amber-300 p-2 rounded-xl border-2 border-slate-900 shadow-[2px_2px_0_#0f172a]">
                    <i class="fa-solid fa-trophy text-lg sm:text-xl text-amber-800"></i>
                </div>
                <div>
                    <h1 class="font-fun text-lg sm:text-xl font-bold leading-tight">做题成绩与答题分析榜</h1>
                    <p class="text-[10px] sm:text-xs text-slate-500 font-sans">Leaderboard & Analytics Portal</p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <a href="admin.html" class="neo-btn px-3 py-1.5 text-xs sm:text-sm flex items-center gap-1.5 bg-slate-100">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>返回教室后台</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 mt-6">
        <div class="neo-card p-4 sm:p-5">
            
            <!-- 级联筛选栏 Header -->
            <div class="bg-amber-100/60 p-4 rounded-xl border-2 border-slate-900 mb-5">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 mb-3">
                    <h3 class="font-fun text-lg sm:text-xl font-bold flex items-center gap-2">
                        <i class="fa-solid fa-filter text-amber-500"></i>
                        <span>做题榜精准检索与多维筛选</span>
                    </h3>
                    <button onclick="clearCurrentQuizLeaderboard()" class="neo-btn neo-btn-danger px-3 py-1.5 text-xs flex items-center gap-1.5">
                        <i class="fa-solid fa-broom"></i>
                        <span>一键清空匹配记录</span>
                    </button>
                </div>

                <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2.5">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-600 mb-1">1. 选择班级</label>
                        <select id="score-filter-class" onchange="fetchScores()" class="neo-input w-full bg-white text-xs font-fun">
                            <option value="ALL">全部班级 (All)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-600 mb-1">2. 科目</label>
                        <select id="score-filter-subject" onchange="fetchScores()" class="neo-input w-full bg-white text-xs font-fun">
                            <option value="ALL">全部科目</option>
                            <option value="chinese">华文</option>
                            <option value="malay">马来文</option>
                            <option value="english">英文</option>
                            <option value="math">数学</option>
                            <option value="science">科学</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-600 mb-1">3. 单元</label>
                        <select id="score-filter-unit" onchange="fetchScores()" class="neo-input w-full bg-white text-xs font-fun">
                            <option value="ALL">全部单元</option>
                            <option value="1">单元 1</option>
                            <option value="2">单元 2</option>
                            <option value="3">单元 3</option>
                            <option value="4">单元 4</option>
                            <option value="5">单元 5</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-600 mb-1">4. 测验 ID/短语</label>
                        <input type="text" id="score-filter-quizid" onkeyup="fetchScores()" placeholder="关键词..." class="neo-input w-full text-xs">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-600 mb-1">5. 展示人数</label>
                        <select id="score-filter-limit" onchange="fetchScores()" class="neo-input w-full bg-white text-xs font-fun">
                            <option value="10">Top 10 名</option>
                            <option value="20" selected>Top 20 名</option>
                            <option value="50">Top 50 名</option>
                            <option value="1000">全部成绩</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-600 mb-1">6. 时间范围</label>
                        <select id="score-filter-timespan" onchange="fetchScores()" class="neo-input w-full bg-white text-xs font-fun">
                            <option value="ALL">全量历史</option>
                            <option value="7">近 7 天</option>
                            <option value="30" selected>近 30 天</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 结果表格 -->
            <div class="overflow-x-auto rounded-xl border-2 border-slate-900 bg-white">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100 border-b-2 border-slate-900 font-fun text-xs sm:text-sm">
                            <th class="p-3 text-center">名次</th>
                            <th class="p-3">学生姓名 / 班级</th>
                            <th class="p-3">做题测验名称</th>
                            <th class="p-3 text-center">得分 / 用时</th>
                            <th class="p-3 text-center">尝试次数 / 错题数</th>
                            <th class="p-3">提交时间</th>
                            <th class="p-3 text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="score-table-body" class="divide-y border-slate-200 text-xs sm:text-sm font-sans">
                        <tr>
                            <td colspan="7" class="p-8 text-center text-slate-400 font-fun text-base">
                                <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><br>正在加载榜单数据...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Edit Score Modal -->
    <div id="edit-score-modal" class="fixed inset-0 modal-overlay z-50 flex items-center justify-center p-4 hidden">
        <div class="neo-card bg-white max-w-md w-full p-6 space-y-4">
            <h3 class="font-fun text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-pen-to-square text-amber-500"></i>
                <span>修正学生测验成绩记录</span>
            </h3>

            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">做题学生</label>
                <p id="modal-score-student-name" class="font-bold text-sm bg-slate-100 p-2.5 rounded-lg border border-slate-300"></p>
            </div>

            <div class="grid grid-cols-3 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">最终得分</label>
                    <input type="number" id="modal-score-input" class="neo-input w-full text-xs font-bold text-red-600">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">尝试次数</label>
                    <input type="number" id="modal-attempts-input" class="neo-input w-full text-xs font-bold text-amber-600">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">错题数</label>
                    <input type="number" id="modal-wrongs-input" class="neo-input w-full text-xs font-bold text-sky-600">
                </div>
            </div>

            <div class="flex justify-end gap-3 pt-2">
                <button onclick="closeEditScoreModal()" class="neo-btn px-4 py-2 text-xs sm:text-sm">取消</button>
                <button onclick="saveScoreRecord()" class="neo-btn neo-btn-primary px-4 py-2 text-xs sm:text-sm">保存更新</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAqp_1JyuAtpQgJtnFRLhuVEmUIrx1YetI",
            authDomain: "my-teacher-studio.firebaseapp.com",
            projectId: "my-teacher-studio",
            storageBucket: "my-teacher-studio.firebasestorage.app",
            messagingSenderId: "82774284780",
            appId: "1:82774284780:web:e29680ea7a0e5c435ec8c9"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let scoreTargetToEdit = null;

        auth.onAuthStateChanged(async (user) => {
            if (!user) { window.location.href = "index.html"; return; }
            try {
                const userDoc = await db.collection("users").doc(user.uid).get();
                if (userDoc.exists && userDoc.data().role === 'teacher') {
                    fetchClassesOptions();
                    fetchScores();
                } else {
                    window.location.href = "dashboard.html";
                }
            } catch (err) { window.location.href = "index.html"; }
        });

        async function fetchClassesOptions() {
            const select = document.getElementById('score-filter-class');
            try {
                const snapshot = await db.collection("classes").get();
                select.innerHTML = `<option value="ALL">全部班级 (All)</option>`;
                snapshot.forEach(doc => {
                    const c = doc.data();
                    select.innerHTML += `<option value="${doc.id}">${doc.id} (${c.className || ''})</option>`;
                });
            } catch (e) {}
        }

        async function fetchScores() {
            const tbody = document.getElementById('score-table-body');
            tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-slate-400 font-fun text-base"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><br>拉取中...</td></tr>`;

            const classVal = document.getElementById('score-filter-class').value;
            const subjectVal = document.getElementById('score-filter-subject').value;
            const unitVal = document.getElementById('score-filter-unit').value;
            const quizIdVal = document.getElementById('score-filter-quizid').value.trim().toLowerCase();
            const limitVal = parseInt(document.getElementById('score-filter-limit').value);
            const timespanVal = document.getElementById('score-filter-timespan').value;

            try {
                const snapshot = await db.collection("leaderboard").orderBy("score", "desc").limit(300).get();
                let records = [];
                const now = new Date();

                snapshot.forEach(doc => {
                    const data = { id: doc.id, ...doc.data() };
                    if (data.status === "pending_delete") return;

                    if (classVal !== 'ALL' && data.classCode !== classVal) return;
                    if (subjectVal !== 'ALL' && data.subject !== subjectVal) return;
                    if (unitVal !== 'ALL' && data.unit != unitVal) return;
                    if (quizIdVal !== '' && !(data.quizId || '').toLowerCase().includes(quizIdVal) && !(data.quizTitle || '').toLowerCase().includes(quizIdVal)) return;

                    if (timespanVal !== 'ALL' && data.timestamp) {
                        const recDate = new Date(data.timestamp.seconds * 1000);
                        if ((now - recDate) / (1000 * 60 * 60 * 24) > parseInt(timespanVal)) return;
                    }
                    records.push(data);
                });

                records.sort((a, b) => (b.score !== a.score) ? b.score - a.score : (a.timeSpent || 9999) - (b.timeSpent || 9999));
                records = records.slice(0, limitVal);

                tbody.innerHTML = '';
                if (records.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-slate-400 italic font-fun">没有匹配的成绩记录</td></tr>`;
                    return;
                }

                records.forEach((r, idx) => {
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-50 transition-colors";

                    let rankBadge = `<span class="font-bold text-slate-500 font-mono">#${idx + 1}</span>`;
                    if (idx === 0) rankBadge = `<span class="text-xl">🥇</span>`;
                    else if (idx === 1) rankBadge = `<span class="text-xl">🥈</span>`;
                    else if (idx === 2) rankBadge = `<span class="text-xl">🥉</span>`;

                    const attempts = r.attemptsCount || 1;
                    const wrongs = (r.wrongAnswersCount !== undefined) ? r.wrongAnswersCount : (r.score < 100 ? 1 : 0);

                    tr.innerHTML = `
                        <td class="p-3 text-center">${rankBadge}</td>
                        <td class="p-3">
                            <div class="font-bold text-slate-900">${r.playerName || '匿名'}</div>
                            <div class="text-xs font-mono text-slate-400">${r.classCode || '未划分班级'}</div>
                        </td>
                        <td class="p-3">
                            <div class="font-semibold text-slate-800 text-xs">${r.quizTitle || r.quizId || '测验'}</div>
                            <div class="text-[10px] text-slate-400 font-mono">${r.subject || ''} / U${r.unit || 1}</div>
                        </td>
                        <td class="p-3 text-center">
                            <span class="font-bold text-red-600 text-sm sm:text-base">${r.score}</span> <span class="text-xs text-slate-400">分</span>
                            <div class="text-xs font-mono text-slate-500">${r.timeText || '-'}</div>
                        </td>
                        <td class="p-3 text-center">
                            <span class="bg-amber-100 text-amber-800 border border-amber-300 px-2 py-0.5 rounded-full text-xs font-bold">第 ${attempts} 次</span>
                            <span class="bg-red-100 text-red-700 border border-red-300 px-2 py-0.5 rounded-full text-xs font-bold">错 ${wrongs} 题</span>
                        </td>
                        <td class="p-3 text-xs text-slate-500">${r.timestamp ? new Date(r.timestamp.seconds * 1000).toLocaleDateString('zh-CN') : '-'}</td>
                        <td class="p-3 text-center">
                            <div class="flex items-center justify-center gap-1">
                                <button onclick="openEditScoreModal('${r.id}', '${r.playerName || '学生'}', ${r.score}, ${attempts}, ${wrongs})" class="neo-btn px-2 py-1 text-xs bg-amber-100"><i class="fa-solid fa-pen-to-square"></i></button>
                                <button onclick="deleteSingleScoreRecord('${r.id}')" class="neo-btn neo-btn-danger px-2 py-1 text-xs"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-red-500 font-semibold">⚠️ 读取榜单失败：${err.message}</td></tr>`;
            }
        }

        function openEditScoreModal(docId, name, score, attempts, wrongs) {
            scoreTargetToEdit = docId;
            document.getElementById('modal-score-student-name').innerText = name;
            document.getElementById('modal-score-input').value = score;
            document.getElementById('modal-attempts-input').value = attempts;
            document.getElementById('modal-wrongs-input').value = wrongs;
            document.getElementById('edit-score-modal').classList.remove('hidden');
        }

        function closeEditScoreModal() {
            scoreTargetToEdit = null;
            document.getElementById('edit-score-modal').classList.add('hidden');
        }

        async function saveScoreRecord() {
            if (!scoreTargetToEdit) return;
            try {
                await db.collection("leaderboard").doc(scoreTargetToEdit).update({
                    score: parseInt(document.getElementById('modal-score-input').value) || 0,
                    attemptsCount: parseInt(document.getElementById('modal-attempts-input').value) || 1,
                    wrongAnswersCount: parseInt(document.getElementById('modal-wrongs-input').value) || 0
                });
                closeEditScoreModal();
                fetchScores();
            } catch (err) { alert("修改失败"); }
        }

        async function deleteSingleScoreRecord(docId) {
            if (!confirm("确认删除此成绩记录？")) return;
            try {
                await db.collection("leaderboard").doc(docId).delete();
                fetchScores();
            } catch (err) {}
        }

        async function clearCurrentQuizLeaderboard() {
            const quizKey = document.getElementById('score-filter-quizid').value.trim();
            if (!quizKey) return alert("请先在「第 4 步」框中输入要一键清空的测验 ID 或名称短语！");
            if (!confirm(`确认彻底一键抹除包含「${quizKey}」的所有成绩记录吗？`)) return;

            try {
                const snapshot = await db.collection("leaderboard").get();
                const batch = db.batch();
                let count = 0;
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if ((data.quizId || '').toLowerCase().includes(quizKey.toLowerCase()) || (data.quizTitle || '').toLowerCase().includes(quizKey.toLowerCase())) {
                        batch.delete(doc.ref);
                        count++;
                    }
                });
                if (count > 0) await batch.commit();
                alert(`🎉 已清除 ${count} 条做题记录！`);
                fetchScores();
            } catch (err) { alert("清空失败"); }
        }
    </script>
</body>
</html>
