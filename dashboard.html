<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun Learning Island - Student Dashboard</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Patrick+Hand&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            font-family: 'Patrick Hand', 'ZCOOL KuaiLe', cursive, sans-serif;
            background-color: #fafafa;
            background-image: radial-gradient(#e5e7eb 1.2px, transparent 1.2px);
            background-size: 20px 20px;
            min-height: 100vh;
            color: #1a1a1a;
            padding-bottom: 40px;
        }

        /* 顶栏 Header */
        .navbar {
            background-color: #ffffff;
            border-bottom: 2px solid #1a1a1a;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0px 4px 0px #1a1a1a;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Fredoka', 'ZCOOL KuaiLe', cursive;
            font-size: 22px;
            font-weight: 700;
        }

        .brand-logo i {
            background: #ffe600;
            padding: 8px;
            border-radius: 12px;
            border: 2px solid #1a1a1a;
            box-shadow: 2px 2px 0px #1a1a1a;
        }

        .user-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-info-badge {
            background: #f4f4f5;
            border: 2px solid #1a1a1a;
            border-radius: 12px;
            padding: 6px 14px;
            font-size: 15px;
            font-weight: 600;
        }

        .btn-ui {
            background: #ffffff;
            border: 2px solid #1a1a1a;
            border-radius: 12px;
            padding: 6px 14px;
            font-family: 'Fredoka', 'ZCOOL KuaiLe', cursive;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 2px 2px 0px #1a1a1a;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s ease;
        }

        .btn-ui:hover {
            background: #ffe600;
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0px #1a1a1a;
        }

        .btn-logout:hover {
            background: #ff4d4d;
            color: #ffffff;
        }

        /* 主体布局 Main Layout */
        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* 顶部过滤器控制区 Selector Section */
        .dashboard-header-card {
            background: #ffffff;
            border: 2px solid #1a1a1a;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 4px 4px 0px #1a1a1a;
            margin-bottom: 28px;
        }

        .title-grade {
            font-family: 'Fredoka', 'ZCOOL KuaiLe', cursive;
            font-size: 28px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .selectors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .form-group label {
            display: block;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .form-select {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #1a1a1a;
            border-radius: 12px;
            font-family: 'Patrick Hand', 'ZCOOL KuaiLe', cursive;
            font-size: 16px;
            outline: none;
            background-color: #ffffff;
            box-shadow: 2px 2px 0px #1a1a1a;
            cursor: pointer;
        }

        .form-select:focus {
            box-shadow: 3px 3px 0px #ffe600;
        }

        /* 三大板块链接区 Link Sections */
        .section-card {
            background: #ffffff;
            border: 2px solid #1a1a1a;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 4px 4px 0px #1a1a1a;
            margin-bottom: 24px;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Fredoka', 'ZCOOL KuaiLe', cursive;
            font-size: 22px;
            margin-bottom: 16px;
            border-bottom: 2px dashed #e5e7eb;
            padding-bottom: 10px;
        }

        .section-header i {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            border: 2px solid #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 2px 2px 0px #1a1a1a;
        }

        /* 颜色区分风格 */
        .icon-quiz { background-color: #ffe600; }
        .icon-review { background-color: #4da6ff; color: white; }
        .icon-game { background-color: #ff66b2; color: white; }

        /* 链接列表 List Grid */
        .link-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 14px;
        }

        .link-item {
            background-color: #ffffff;
            border: 2px solid #1a1a1a;
            border-radius: 14px;
            padding: 12px 16px;
            text-decoration: none;
            color: #1a1a1a;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 2px 2px 0px #1a1a1a;
            transition: all 0.15s ease;
        }

        .link-item:hover {
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0px #1a1a1a;
            background-color: #fff9c4;
        }

        .empty-tip {
            color: #888;
            font-size: 15px;
            font-style: italic;
            padding: 10px 0;
        }

        .tag-class-type {
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid #1a1a1a;
            margin-left: 6px;
            background: #e0f2fe;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 顶部导航栏 Navbar -->
    <div class="navbar">
        <div class="brand-logo">
            <i class="fa-solid fa-gamepad"></i>
            <span id="txt-app-title">趣味学习岛</span>
        </div>

        <div class="user-actions">
            <button type="button" class="btn-ui" onclick="toggleLanguage()">
                <i class="fa-solid fa-globe"></i>
                <span id="lang-btn-text">English</span>
            </button>
            <div class="user-info-badge">
                <i class="fa-solid fa-user-graduate"></i>
                <span id="user-name-display">加载中...</span>
                <span id="class-type-badge" class="tag-class-type">安亲班</span>
            </div>
            <button type="button" class="btn-ui btn-logout" onclick="handleLogout()">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span id="txt-logout">退出</span>
            </button>
        </div>
    </div>

    <!-- 主内容区域 Container -->
    <div class="container">
        
        <!-- 头部过滤器卡片 Header Selector Card -->
        <div class="dashboard-header-card">
            <div class="title-grade">
                <i class="fa-solid fa-graduation-cap"></i>
                <span id="display-grade-title">X 年级学习区</span>
            </div>

            <div class="selectors-grid">
                <!-- 切换年级 -->
                <div class="form-group">
                    <label for="select-grade" id="lbl-select-grade">选择年级</label>
                    <select id="select-grade" class="form-select" onchange="onGradeChange()">
                        <option value="1">一年级 (Grade 1)</option>
                        <option value="2">二年级 (Grade 2)</option>
                        <option value="3">三年级 (Grade 3)</option>
                        <option value="4">四年级 (Grade 4)</option>
                        <option value="5">五年级 (Grade 5)</option>
                        <option value="6">六年级 (Grade 6)</option>
                    </select>
                </div>

                <!-- 选择科目 -->
                <div class="form-group">
                    <label for="select-subject" id="lbl-select-subject">选择科目</label>
                    <select id="select-subject" class="form-select" onchange="onSubjectChange()">
                        <!-- 动态生成 -->
                    </select>
                </div>

                <!-- 选择单元 -->
                <div class="form-group">
                    <label for="select-unit" id="lbl-select-unit">选择单元</label>
                    <select id="select-unit" class="form-select" onchange="renderResources()">
                        <!-- 动态生成 -->
                    </select>
                </div>
            </div>
        </div>

        <!-- 1. 测验板块 Quiz Section -->
        <div class="section-card">
            <div class="section-header">
                <i class="fa-solid fa-file-pen icon-quiz"></i>
                <span id="txt-sec-quiz">测验 (Quizzes)</span>
            </div>
            <div class="link-grid" id="quiz-list">
                <!-- 动态嵌入链接 -->
            </div>
        </div>

        <!-- 2. 复习板块 Review Section -->
        <div class="section-card">
            <div class="section-header">
                <i class="fa-solid fa-book-open icon-review"></i>
                <span id="txt-sec-review">复习 (Revision)</span>
            </div>
            <div class="link-grid" id="review-list">
                <!-- 动态嵌入链接 -->
            </div>
        </div>

        <!-- 3. 游戏板块 Games Section -->
        <div class="section-card">
            <div class="section-header">
                <i class="fa-solid fa-dice icon-game"></i>
                <span id="txt-sec-game">游戏 (Educational Games)</span>
            </div>
            <div class="link-grid" id="game-list">
                <!-- 动态嵌入链接 -->
            </div>
        </div>

    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAqp_1JyuAtpQgJtnFRLhuVEmUIrx1YetI",
            authDomain: "my-teacher-studio.firebaseapp.com",
            projectId: "my-teacher-studio",
            storageBucket: "my-teacher-studio.firebasestorage.app",
            messagingSenderId: "82774284780",
            appId: "1:82774284780:web:e29680ea7a0e5c435ec8c9"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // 当前状态数据 State
        let currentUserData = null;
        let currentLang = 'zh';

        // 基础所有科目表
        const allSubjects = [
            { id: 'chinese', zh: '华文', en: 'Chinese' },
            { id: 'malay', zh: '马来文', en: 'Malay' },
            { id: 'english', zh: '英文', en: 'English' },
            { id: 'math', zh: '数学', en: 'Mathematics' },
            { id: 'science', zh: '科学', en: 'Science' }
        ];

        const translations = {
            zh: {
                langBtn: "English", appTitle: "趣味学习岛", logout: "退出",
                lblGrade: "选择年级", lblSubject: "选择科目", lblUnit: "选择单元",
                secQuiz: "测验", secReview: "复习", secGame: "游戏",
                emptyTip: "暂无相关链接资源", loadingTip: "正在载入资源...", gradeTitleSuffix: "年级学习区",
                tagAll: "安亲班", tagCn: "中文班", unitPrefix: "单元 "
            },
            en: {
                langBtn: "中文", appTitle: "Fun Learning Island", logout: "Logout",
                lblGrade: "Grade", lblSubject: "Subject", lblUnit: "Unit",
                secQuiz: "Quizzes", secReview: "Revision", secGame: "Games",
                emptyTip: "No resources available for now", loadingTip: "Loading resources...", gradeTitleSuffix: " Learning Area",
                tagAll: "Daycare", tagCn: "Chinese Class", unitPrefix: "Unit "
            }
        };

        // 页面初始化 Authentication Check
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = "index.html";
                return;
            }

            try {
                const doc = await db.collection("users").doc(user.uid).get();
                if (doc.exists) {
                    currentUserData = doc.data();
                } else {
                    currentUserData = { name: user.displayName || "学生", grade: 1, classType: 'all_subjects' };
                }
                setupDashboardUI();
            } catch (err) {
                console.error("加载用户信息失败:", err);
            }
        });

        // 根据用户信息初始化 Dashboard 界面
        function setupDashboardUI() {
            document.getElementById('user-name-display').innerText = currentUserData.name || "学生";
            
            const badge = document.getElementById('class-type-badge');
            if (currentUserData.classType === 'chinese_only') {
                badge.innerText = translations[currentLang].tagCn;
                badge.style.backgroundColor = '#fef3c7';
            } else {
                badge.innerText = translations[currentLang].tagAll;
                badge.style.backgroundColor = '#e0f2fe';
            }

            const userGrade = currentUserData.grade || 1;
            document.getElementById('select-grade').value = userGrade;

            initSubjectDropdown();
            updateGradeTitle();
        }

        // 初始化/更新 科目下拉菜单
        function initSubjectDropdown() {
            const subjectSelect = document.getElementById('select-subject');
            subjectSelect.innerHTML = '';

            let filteredSubjects = allSubjects;
            if (currentUserData && currentUserData.classType === 'chinese_only') {
                filteredSubjects = allSubjects.filter(sub => sub.id === 'chinese');
            }

            filteredSubjects.forEach(sub => {
                const opt = document.createElement('option');
                opt.value = sub.id;
                opt.innerText = currentLang === 'zh' ? sub.zh : sub.en;
                subjectSelect.appendChild(opt);
            });

            onSubjectChange(); 
        }

        // 年级切换响应
        function onGradeChange() {
            updateGradeTitle();
            renderResources();
        }

        // 科目切换响应（生成 1 ~ 10 单元选项）
        function onSubjectChange() {
            const unitSelect = document.getElementById('select-unit');
            unitSelect.innerHTML = '';

            const t = translations[currentLang];
            for (let i = 1; i <= 10; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.innerText = `${t.unitPrefix}${i}`;
                unitSelect.appendChild(opt);
            }

            renderResources();
        }

        // 更新年级标题
        function updateGradeTitle() {
            const gradeVal = document.getElementById('select-grade').value;
            const t = translations[currentLang];
            if (currentLang === 'zh') {
                const gradeZh = ['一', '二', '三', '四', '五', '六'][gradeVal - 1];
                document.getElementById('display-grade-title').innerText = `${gradeZh}${t.gradeTitleSuffix}`;
            } else {
                document.getElementById('display-grade-title').innerText = `Grade ${gradeVal}${t.gradeTitleSuffix}`;
            }
        }

        // 核心修改：直接从 Firebase Firestore 查询真实测验/游戏资源
        async function renderResources() {
            const grade = parseInt(document.getElementById('select-grade').value);
            const subject = document.getElementById('select-subject').value;
            const unit = parseInt(document.getElementById('select-unit').value);

            const t = translations[currentLang];

            // 先显示加载提示
            document.getElementById('quiz-list').innerHTML = `<div class="empty-tip">${t.loadingTip}</div>`;
            document.getElementById('review-list').innerHTML = `<div class="empty-tip">${t.loadingTip}</div>`;
            document.getElementById('game-list').innerHTML = `<div class="empty-tip">${t.loadingTip}</div>`;

            try {
                // 向 Firestore 提取当前选中的【年级 + 科目 + 单元】数据
                const snapshot = await db.collection("resources")
                    .where("grade", "==", grade)
                    .where("subject", "==", subject)
                    .where("unit", "==", unit)
                    .get();

                const quizzes = [];
                const reviews = [];
                const games = [];

                snapshot.forEach(doc => {
                    const item = doc.data();
                    if (item.type === 'quiz') quizzes.push(item);
                    else if (item.type === 'review') reviews.push(item);
                    else if (item.type === 'game') games.push(item);
                });

                // 渲染到对应板块
                renderLinkGrid('quiz-list', quizzes, 'fa-circle-question');
                renderLinkGrid('review-list', reviews, 'fa-file-lines');
                renderLinkGrid('game-list', games, 'fa-gamepad');

            } catch (error) {
                console.error("读取 Firebase 资源失败:", error);
                document.getElementById('quiz-list').innerHTML = `<div class="empty-tip">${t.emptyTip}</div>`;
                document.getElementById('review-list').innerHTML = `<div class="empty-tip">${t.emptyTip}</div>`;
                document.getElementById('game-list').innerHTML = `<div class="empty-tip">${t.emptyTip}</div>`;
            }
        }

        function renderLinkGrid(elementId, items, iconClass) {
            const container = document.getElementById(elementId);
            container.innerHTML = '';

            if (items.length === 0) {
                container.innerHTML = `<div class="empty-tip">${translations[currentLang].emptyTip}</div>`;
                return;
            }

            items.forEach(item => {
                const a = document.createElement('a');
                a.href = item.url;
                a.className = 'link-item';
                a.target = '_blank';
                a.innerHTML = `
                    <span><i class="fa-solid ${iconClass}" style="margin-right:8px;"></i>${item.title}</span>
                    <i class="fa-solid fa-chevron-right" style="font-size:12px; opacity:0.6;"></i>
                `;
                container.appendChild(a);
            });
        }

        // 多语言切换
        function toggleLanguage() {
            currentLang = (currentLang === 'zh') ? 'en' : 'zh';
            const t = translations[currentLang];

            document.getElementById('lang-btn-text').innerText = t.langBtn;
            document.getElementById('txt-app-title').innerText = t.appTitle;
            document.getElementById('txt-logout').innerText = t.logout;
            document.getElementById('lbl-select-grade').innerText = t.lblGrade;
            document.getElementById('lbl-select-subject').innerText = t.lblSubject;
            document.getElementById('lbl-select-unit').innerText = t.lblUnit;
            document.getElementById('txt-sec-quiz').innerText = t.secQuiz;
            document.getElementById('txt-sec-review').innerText = t.secReview;
            document.getElementById('txt-sec-game').innerText = t.secGame;

            if (currentUserData) {
                setupDashboardUI();
            }
        }

        // 登出逻辑
        function handleLogout() {
            auth.signOut().then(() => {
                window.location.href = "index.html";
            });
        }
    </script>
</body>
</html>
