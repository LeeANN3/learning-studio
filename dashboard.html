<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun Learning Island - Student Dashboard</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Patrick+Hand&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            font-family: 'Patrick Hand', 'ZCOOL KuaiLe', cursive, sans-serif;
            background-color: #fafafa;
            background-image: radial-gradient(#e5e7eb 1.2px, transparent 1.2px);
            background-size: 20px 20px;
            min-height: 100vh;
            color: #1a1a1a;
            padding-bottom: 40px;
        }

        .navbar {
            background-color: #ffffff;
            border-bottom: 2px solid #1a1a1a;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0px 4px 0px #1a1a1a;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Fredoka', 'ZCOOL KuaiLe', cursive;
            font-size: 18px;
            font-weight: 700;
            white-space: nowrap;
        }

        .brand-logo i {
            background: #ffe600;
            padding: 6px;
            border-radius: 10px;
            border: 2px solid #1a1a1a;
            box-shadow: 2px 2px 0px #1a1a1a;
            font-size: 16px;
        }

        .user-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .user-info-badge {
            background: #f4f4f5;
            border: 2px solid #1a1a1a;
            border-radius: 10px;
            padding: 4px 8px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .btn-ui {
            background: #ffffff;
            border: 2px solid #1a1a1a;
            border-radius: 10px;
            padding: 4px 10px;
            font-family: 'Fredoka', 'ZCOOL KuaiLe', cursive;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 2px 2px 0px #1a1a1a;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.15s ease;
            white-space: nowrap;
            text-decoration: none;
            color: #1a1a1a;
        }

        .btn-ui:hover {
            background: #ffe600;
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0px #1a1a1a;
        }

        .btn-teacher-admin { background: #ffe600; border-color: #1a1a1a; }
        .btn-teacher-admin:hover { background: #facc15; }
        .btn-logout:hover { background: #ff4d4d; color: #ffffff; }

        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 16px;
        }

        .dashboard-header-card {
            background: #ffffff;
            border: 2px solid #1a1a1a;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 4px 4px 0px #1a1a1a;
            margin-bottom: 20px;
        }

        .title-grade {
            font-family: 'Fredoka', 'ZCOOL KuaiLe', cursive;
            font-size: 22px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .selectors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .form-select {
            width: 100%;
            padding: 8px 10px;
            border: 2px solid #1a1a1a;
            border-radius: 10px;
            font-family: 'Patrick Hand', 'ZCOOL KuaiLe', cursive;
            font-size: 15px;
            outline: none;
            background-color: #ffffff;
            box-shadow: 2px 2px 0px #1a1a1a;
            cursor: pointer;
        }

        .section-card {
            background: #ffffff;
            border: 2px solid #1a1a1a;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 4px 4px 0px #1a1a1a;
            margin-bottom: 20px;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Fredoka', 'ZCOOL KuaiLe', cursive;
            font-size: 18px;
            margin-bottom: 12px;
            border-bottom: 2px dashed #e5e7eb;
            padding-bottom: 8px;
        }

        .section-header i {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 2px solid #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            box-shadow: 2px 2px 0px #1a1a1a;
        }

        .icon-quiz { background-color: #ffe600; }
        .icon-review { background-color: #4da6ff; color: white; }
        .icon-game { background-color: #ff66b2; color: white; }

        .link-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 10px;
        }

        .link-item {
            background-color: #ffffff;
            border: 2px solid #1a1a1a;
            border-radius: 12px;
            padding: 10px 12px;
            text-decoration: none;
            color: #1a1a1a;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 2px 2px 0px #1a1a1a;
            transition: all 0.15s ease;
        }

        .link-item:hover {
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0px #1a1a1a;
            background-color: #fff9c4;
        }

        .empty-tip { color: #888; font-size: 13px; font-style: italic; padding: 6px 0; }
        .tag-class-type { font-size: 10px; padding: 1px 6px; border-radius: 4px; border: 1px solid #1a1a1a; background: #e0f2fe; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="brand-logo">
            <i class="fa-solid fa-gamepad"></i>
            <span id="txt-app-title">趣味学习岛</span>
        </div>

        <div class="user-actions">
            <a href="admin.html" id="btn-admin-portal" class="btn-ui btn-teacher-admin hidden">
                <i class="fa-solid fa-chalkboard-user"></i>
                <span id="txt-admin-portal">教室后台</span>
            </a>

            <button type="button" class="btn-ui" onclick="toggleLanguage()">
                <i class="fa-solid fa-globe"></i>
                <span id="lang-btn-text">English</span>
            </button>
            <div class="user-info-badge">
                <i id="user-role-icon" class="fa-solid fa-user-graduate"></i>
                <span id="user-name-display">验证中...</span>
            </div>
            <button type="button" class="btn-ui btn-logout" onclick="handleLogout()">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </div>
    </div>

    <div class="container">
        
        <div class="dashboard-header-card">
            <div class="title-grade">
                <i class="fa-solid fa-graduation-cap"></i>
                <span id="display-grade-title">学习区</span>
            </div>

            <div class="selectors-grid">
                <div class="form-group">
                    <label for="select-grade" id="lbl-select-grade">选择年级</label>
                    <select id="select-grade" class="form-select" onchange="onGradeChange()">
                        <option value="1">一年级 (Grade 1)</option>
                        <option value="2">二年级 (Grade 2)</option>
                        <option value="3">三年级 (Grade 3)</option>
                        <option value="4">四年级 (Grade 4)</option>
                        <option value="5">五年级 (Grade 5)</option>
                        <option value="6">六年级 (Grade 6)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="select-subject" id="lbl-select-subject">选择科目</label>
                    <select id="select-subject" class="form-select" onchange="onSubjectChange()"></select>
                </div>

                <div class="form-group">
                    <label for="select-unit" id="lbl-select-unit">选择单元</label>
                    <select id="select-unit" class="form-select" onchange="renderResources()"></select>
                </div>
            </div>
        </div>

        <div class="section-card">
            <div class="section-header">
                <i class="fa-solid fa-file-pen icon-quiz"></i>
                <span id="txt-sec-quiz">测验 (Quizzes)</span>
            </div>
            <div class="link-grid" id="quiz-list"></div>
        </div>

        <div class="section-card">
            <div class="section-header">
                <i class="fa-solid fa-book-open icon-review"></i>
                <span id="txt-sec-review">复习 (Revision)</span>
            </div>
            <div class="link-grid" id="review-list"></div>
        </div>

        <div class="section-card">
            <div class="section-header">
                <i class="fa-solid fa-dice icon-game"></i>
                <span id="txt-sec-game">游戏 (Educational Games)</span>
            </div>
            <div class="link-grid" id="game-list"></div>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAqp_1JyuAtpQgJtnFRLhuVEmUIrx1YetI",
            authDomain: "my-teacher-studio.firebaseapp.com",
            projectId: "my-teacher-studio",
            storageBucket: "my-teacher-studio.firebasestorage.app",
            messagingSenderId: "82774284780",
            appId: "1:82774284780:web:e29680ea7a0e5c435ec8c9"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUserData = null;
        let currentLang = 'zh';

        const allSubjects = [
            { id: 'chinese', zh: '华文', en: 'Chinese' },
            { id: 'malay', zh: '马来文', en: 'Malay' },
            { id: 'english', zh: '英文', en: 'English' },
            { id: 'math', zh: '数学', en: 'Mathematics' },
            { id: 'science', zh: '科学', en: 'Science' }
        ];

        const translations = {
            zh: {
                langBtn: "English", appTitle: "趣味学习岛", logout: "退出", adminPortal: "教师后台",
                lblGrade: "选择年级", lblSubject: "选择科目", lblUnit: "选择单元",
                secQuiz: "测验", secReview: "复习", secGame: "游戏",
                emptyTip: "暂无相关链接资源", loadingTip: "载入中...", gradeTitleSuffix: "年级学习区",
                tagStudent: "学生", tagTeacher: "教师", unitPrefix: "单元 "
            },
            en: {
                langBtn: "中文", appTitle: "Fun Learning", logout: "Exit", adminPortal: "Admin",
                lblGrade: "Grade", lblSubject: "Subject", lblUnit: "Unit",
                secQuiz: "Quizzes", secReview: "Revision", secGame: "Games",
                emptyTip: "No resources available", loadingTip: "Loading...", gradeTitleSuffix: " Learning Area",
                tagStudent: "Student", tagTeacher: "Teacher", unitPrefix: "Unit "
            }
        };

        auth.onAuthStateChanged(async (user) => {
            if (!user) { window.location.href = "index.html"; return; }
            try {
                const doc = await db.collection("users").doc(user.uid).get();
                if (doc.exists) {
                    currentUserData = doc.data();
                } else {
                    currentUserData = { name: user.displayName || "使用者", role: 'student', grade: 1 };
                }
                setupDashboardUI();
            } catch (err) { window.location.href = "index.html"; }
        });

        function setupDashboardUI() {
            document.getElementById('user-name-display').innerText = currentUserData.name || "使用者";
            const adminBtn = document.getElementById('btn-admin-portal');

            if (currentUserData.role === 'teacher') {
                adminBtn.classList.remove('hidden');
            } else {
                adminBtn.classList.add('hidden');
            }

            document.getElementById('select-grade').value = currentUserData.grade || 1;
            initSubjectDropdown();
            updateGradeTitle();
        }

        function initSubjectDropdown() {
            const subjectSelect = document.getElementById('select-subject');
            subjectSelect.innerHTML = '';
            allSubjects.forEach(sub => {
                const opt = document.createElement('option');
                opt.value = sub.id;
                opt.innerText = currentLang === 'zh' ? sub.zh : sub.en;
                subjectSelect.appendChild(opt);
            });
            onSubjectChange(); 
        }

        function onGradeChange() { updateGradeTitle(); renderResources(); }
        function onSubjectChange() {
            const unitSelect = document.getElementById('select-unit');
            unitSelect.innerHTML = '';
            const t = translations[currentLang];
            for (let i = 1; i <= 20; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.innerText = `${t.unitPrefix}${i}`;
                unitSelect.appendChild(opt);
            }
            renderResources();
        }

        function updateGradeTitle() {
            const gradeVal = document.getElementById('select-grade').value;
            const t = translations[currentLang];
            document.getElementById('display-grade-title').innerText = currentLang === 'zh' 
                ? `${['一', '二', '三', '四', '五', '六'][gradeVal - 1]}${t.gradeTitleSuffix}`
                : `Grade ${gradeVal}${t.gradeTitleSuffix}`;
        }

        async function renderResources() {
            const gradeVal = document.getElementById('select-grade').value;
            const subjectVal = document.getElementById('select-subject').value;
            const unitVal = document.getElementById('select-unit').value;
            const t = translations[currentLang];

            ['quiz-list', 'review-list', 'game-list'].forEach(id => {
                document.getElementById(id).innerHTML = `<div class="empty-tip">${t.loadingTip}</div>`;
            });

            try {
                const snapshot = await db.collection("resources").where("subject", "==", subjectVal).get();
                const quizzes = [], reviews = [], games = [];
                const userId = auth.currentUser ? auth.currentUser.uid : null;
                const userRole = currentUserData ? currentUserData.role : 'student';
                const userClasses = (currentUserData && currentUserData.enrolledClasses) ? currentUserData.enrolledClasses : [];

                snapshot.forEach(doc => {
                    const item = doc.data();
                    if (item.grade != gradeVal || item.unit != unitVal) return;

                    let hasPermission = false;
                    if (userRole === 'teacher') {
                        hasPermission = true;
                    } else {
                        const isPublished = (item.isPublished !== false);
                        const unlockedClasses = item.unlockedClasses || [];
                        const excludedStudents = item.excludedStudents || [];
                        const inUnlockedClass = userClasses.some(cls => unlockedClasses.includes(cls));
                        const isExcluded = excludedStudents.includes(userId);
                        if (isPublished && inUnlockedClass && !isExcluded) hasPermission = true;
                    }

                    if (hasPermission) {
                        if (item.type === 'quiz') quizzes.push(item);
                        else if (item.type === 'review') reviews.push(item);
                        else if (item.type === 'game') games.push(item);
                    }
                });

                renderLinkGrid('quiz-list', quizzes, 'fa-circle-question');
                renderLinkGrid('review-list', reviews, 'fa-file-lines');
                renderLinkGrid('game-list', games, 'fa-gamepad');
            } catch (error) {
                ['quiz-list', 'review-list', 'game-list'].forEach(id => {
                    document.getElementById(id).innerHTML = `<div class="empty-tip">${t.emptyTip}</div>`;
                });
            }
        }

        function renderLinkGrid(elementId, items, iconClass) {
            const container = document.getElementById(elementId);
            container.innerHTML = items.length === 0 ? `<div class="empty-tip">${translations[currentLang].emptyTip}</div>` : '';

            items.forEach(item => {
                const a = document.createElement('a');
                a.href = item.url || '#';
                a.className = 'link-item';
                a.target = '_blank';
                a.innerHTML = `
                    <span><i class="fa-solid ${iconClass}" style="margin-right:6px;"></i>${item.title || 'Untitled'}</span>
                    <i class="fa-solid fa-chevron-right" style="font-size:12px; opacity:0.6;"></i>
                `;
                container.appendChild(a);
            });
        }

        function toggleLanguage() {
            currentLang = (currentLang === 'zh') ? 'en' : 'zh';
            setupDashboardUI();
        }

        function handleLogout() {
            auth.signOut().then(() => { window.location.href = "index.html"; });
        }
    </script>
</body>
</html>
