<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun Learning Island - 学生端学习岛</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Patrick+Hand&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            font-family: 'Patrick Hand', 'ZCOOL KuaiLe', cursive, sans-serif;
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
            background-size: 20px 20px;
            min-height: 100vh;
            color: #0f172a;
        }

        .font-fun { font-family: 'Fredoka', 'ZCOOL KuaiLe', cursive; }

        .neo-card {
            background-color: #ffffff;
            border: 2px solid #0f172a;
            border-radius: 16px;
            box-shadow: 4px 4px 0px #0f172a;
        }

        .neo-btn {
            background-color: #ffffff;
            border: 2px solid #0f172a;
            border-radius: 12px;
            box-shadow: 2px 2px 0px #0f172a;
            transition: all 0.15s ease;
            font-family: 'Fredoka', 'ZCOOL KuaiLe', cursive;
            font-weight: 600;
        }

        .neo-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0px #0f172a;
        }

        .neo-btn-primary { background-color: #ffe600; }
        .neo-btn-primary:hover { background-color: #facc15; }

        .neo-input {
            border: 2px solid #0f172a;
            border-radius: 10px;
            outline: none;
            padding: 8px 12px;
            box-shadow: 2px 2px 0px #cbd5e1;
        }
        .neo-input:focus { box-shadow: 2px 2px 0px #ffe600; }

        .resource-card {
            border: 2px solid #0f172a;
            border-radius: 14px;
            box-shadow: 3px 3px 0px #0f172a;
            transition: transform 0.15s ease;
        }
        .resource-card:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px #0f172a;
        }
    </style>
</head>
<body class="pb-12">

    <!-- Top Navigation Bar -->
    <nav class="bg-white border-b-2 border-slate-900 sticky top-0 z-40 px-3 sm:px-6 py-2.5 shadow-[0_4px_0_#0f172a]">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            
            <div class="flex items-center gap-2.5">
                <div class="bg-amber-300 p-2 rounded-xl border-2 border-slate-900 shadow-[2px_2px_0_#0f172a]">
                    <i class="fa-solid fa-gamepad text-xl"></i>
                </div>
                <div>
                    <h1 class="font-fun text-lg sm:text-xl font-bold leading-tight">趣味学习岛</h1>
                    <p class="text-[10px] sm:text-xs text-slate-500 font-sans">Fun Learning Island</p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <!-- 个人中心 Portal 入口 -->
                <a href="profile.html" class="neo-btn bg-amber-100 hover:bg-amber-200 px-3 py-1.5 text-xs sm:text-sm flex items-center gap-1.5">
                    <i class="fa-solid fa-user-gear"></i>
                    <span class="hidden sm:inline">个人主页</span>
                </a>

                <!-- 教师后台快捷入口 (仅 Teacher 角色可见) -->
                <a href="admin.html" id="nav-teacher-btn" class="neo-btn bg-amber-300 hover:bg-amber-400 px-3 py-1.5 text-xs sm:text-sm items-center gap-1.5 hidden">
                    <i class="fa-solid fa-chalkboard-user"></i>
                    <span class="hidden sm:inline">教师后台</span>
                </a>

                <button onclick="handleLogout()" class="neo-btn bg-rose-100 hover:bg-rose-200 text-rose-700 px-3 py-1.5 text-xs sm:text-sm flex items-center gap-1">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 mt-6 space-y-6">

        <!-- 🔒 商业防护级 Dynamic Dropdown Selector (仅渲染已解锁项目) -->
        <div class="neo-card p-4 bg-amber-50/80">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-3">
                <h2 class="font-fun text-base sm:text-lg font-bold flex items-center gap-2">
                    <i class="fa-solid fa-filter text-amber-500"></i>
                    <span>已授权课程单元筛选</span>
                </h2>
                <div class="text-xs text-slate-500 font-bold" id="user-status-tip">
                    <i class="fa-solid fa-spinner fa-spin"></i> 正在加载权限...
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">科目 (Subject)</label>
                    <select id="select-subject" onchange="filterResources()" class="neo-input w-full bg-white font-fun text-xs sm:text-sm">
                        <option value="">加载中...</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">年级 (Grade)</label>
                    <select id="select-grade" onchange="filterResources()" class="neo-input w-full bg-white font-fun text-xs sm:text-sm">
                        <option value="">加载中...</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">单元 (Unit)</label>
                    <select id="select-unit" onchange="filterResources()" class="neo-input w-full bg-white font-fun text-xs sm:text-sm">
                        <option value="">加载中...</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 🎮 游戏机制 & 测验板块 -->
        <div class="space-y-4">
            <h3 class="font-fun text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-trophy text-amber-500"></i>
                <span>互动测验与游戏 (Quizzes & Games)</span>
            </h3>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="quiz-list">
                <div class="col-span-full p-8 text-center neo-card bg-white text-slate-400 font-fun">
                    <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><br>正在拉取您的授权课程...
                </div>
            </div>
        </div>

        <!-- 📖 复习与学习资料板块 -->
        <div class="space-y-4">
            <h3 class="font-fun text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-book-open text-sky-500"></i>
                <span>复习指南与讲义 (Review Materials)</span>
            </h3>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="review-list">
                <div class="col-span-full p-8 text-center neo-card bg-white text-slate-400 font-fun">
                    <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><br>正在加载复习讲义...
                </div>
            </div>
        </div>

    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAqp_1JyuAtpQgJtnFRLhuVEmUIrx1YetI",
            authDomain: "my-teacher-studio.firebaseapp.com",
            projectId: "my-teacher-studio",
            storageBucket: "my-teacher-studio.firebasestorage.app",
            messagingSenderId: "82774284780",
            appId: "1:82774284780:web:e29680ea7a0e5c435ec8c9"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUserData = null;
        let myAllowedResources = []; // 存储该学生有权限访问的所有资源

        // 🎮 Runner 页面映射字典 (方便后续扩展新游戏)
        const runnerMap = {
            'multiple_choice': 'quiz-runner.html',
            'card_matching': 'card-runner.html',
            'spelling_game': 'spelling-runner.html'
        };

        auth.onAuthStateChanged(async (user) => {
            if (!user) { window.location.href = "index.html"; return; }
            
            try {
                const userDoc = await db.collection("users").doc(user.uid).get();
                if (userDoc.exists) {
                    currentUserData = { uid: user.uid, ...userDoc.data() };
                    
                    if (currentUserData.role === 'teacher') {
                        document.getElementById('nav-teacher-btn').classList.remove('hidden');
                        document.getElementById('nav-teacher-btn').classList.add('flex');
                    }

                    document.getElementById('user-status-tip').innerText = `欢迎你，${currentUserData.name || '同学'}`;
                    await loadAndRenderAccessibleResources();
                } else {
                    window.location.href = "index.html";
                }
            } catch (err) {
                console.error("验证登录失败:", err);
            }
        });

        // 🔒 核心防御：完全按“已有授权”动态反向生成下拉菜单，防竞争对手爬取课程库
        async function loadAndRenderAccessibleResources() {
            try {
                const snapshot = await db.collection("resources").get();
                myAllowedResources = [];

                const userRole = currentUserData ? currentUserData.role : 'student';
                const userClasses = (currentUserData && currentUserData.enrolledClasses) ? currentUserData.enrolledClasses : [];
                const userId = currentUserData ? currentUserData.uid : null;

                const allowedSubjects = new Set();
                const allowedGrades = new Set();
                const allowedUnits = new Set();

                snapshot.forEach(doc => {
                    const item = { id: doc.id, ...doc.data() };
                    let hasPermission = false;

                    if (userRole === 'teacher') {
                        hasPermission = true; // 教师可见所有
                    } else {
                        const isPublished = (item.isPublished !== false);
                        const unlockedClasses = item.unlockedClasses || [];
                        const excludedStudents = item.excludedStudents || [];

                        // 校验：学生绑定的班级中，是否有任何一个属于资料解锁列表
                        const inUnlockedClass = userClasses.some(cls => unlockedClasses.includes(cls));
                        const isExcluded = excludedStudents.includes(userId);

                        if (isPublished && inUnlockedClass && !isExcluded) {
                            hasPermission = true;
                        }
                    }

                    if (hasPermission) {
                        myAllowedResources.push(item);
                        if (item.subject) allowedSubjects.add(item.subject);
                        if (item.grade !== undefined && item.grade !== null) allowedGrades.add(item.grade);
                        if (item.unit) allowedUnits.add(item.unit);
                    }
                });

                // 如果未分配班级或未解锁任何资料，显示保密锁定
                if (myAllowedResources.length === 0) {
                    renderEmptyOptions('select-subject', '无解锁科目');
                    renderEmptyOptions('select-grade', '无解锁年级');
                    renderEmptyOptions('select-unit', '无解锁单元');

                    document.getElementById('quiz-list').innerHTML = `<div class="col-span-full p-8 text-center neo-card bg-amber-50 text-slate-500 font-fun">🔒 您当前暂无解锁的测验或游戏。<br><span class="text-xs text-slate-400 font-sans">请联系补习班老师为您分配班级与解锁对应单元。</span></div>`;
                    document.getElementById('review-list').innerHTML = `<div class="col-span-full p-8 text-center neo-card bg-amber-50 text-slate-500 font-fun">🔒 暂无复习资料</div>`;
                    return;
                }

                // 动态构建下拉列表（防暴露其他未解锁单元）
                populateSelect('select-subject', Array.from(allowedSubjects), val => val);
                populateSelect('select-grade', Array.from(allowedGrades).sort((a,b)=>a-b), val => `${val} 年级`);
                populateSelect('select-unit', Array.from(allowedUnits).sort((a,b)=>a-b), val => `单元 ${val}`);

                filterResources();

            } catch (err) {
                console.error("加载资源失败:", err);
            }
        }

        function populateSelect(elemId, valuesArray, formatterFn) {
            const select = document.getElementById(elemId);
            select.innerHTML = '<option value="ALL">全部 (All)</option>';
            valuesArray.forEach(val => {
                const opt = document.createElement('option');
                opt.value = val;
                opt.innerText = formatterFn(val);
                select.appendChild(opt);
            });
        }

        function renderEmptyOptions(elemId, text) {
            document.getElementById(elemId).innerHTML = `<option value="">${text}</option>`;
        }

        function filterResources() {
            const selectedSubject = document.getElementById('select-subject').value;
            const selectedGrade = document.getElementById('select-grade').value;
            const selectedUnit = document.getElementById('select-unit').value;

            const quizContainer = document.getElementById('quiz-list');
            const reviewContainer = document.getElementById('review-list');

            quizContainer.innerHTML = '';
            reviewContainer.innerHTML = '';

            let quizCount = 0, reviewCount = 0;

            myAllowedResources.forEach(r => {
                const matchSub = (selectedSubject === 'ALL' || !selectedSubject) || r.subject === selectedSubject;
                const matchGrade = (selectedGrade === 'ALL' || !selectedGrade) || r.grade == selectedGrade;
                const matchUnit = (selectedUnit === 'ALL' || !selectedUnit) || r.unit == selectedUnit;

                if (matchSub && matchGrade && matchUnit) {
                    if (r.type === 'quiz' || r.type === 'game' || !r.type) {
                        quizCount++;
                        
                        // 动态获取游戏路由
                        const runnerPage = runnerMap[r.gameType] || 'quiz-runner.html';
                        const targetUrl = `${runnerPage}?quizId=${r.id}`;

                        quizContainer.innerHTML += `
                            <div class="resource-card p-4 bg-white flex flex-col justify-between">
                                <div>
                                    <div class="flex justify-between items-start mb-2">
                                        <span class="bg-amber-300 text-slate-900 border border-slate-900 font-bold px-2 py-0.5 rounded text-[11px] font-fun">${r.subject || '科目'}</span>
                                        <span class="text-xs bg-slate-100 border border-slate-300 px-2 py-0.5 rounded font-bold text-slate-600">${r.grade || 1}年级 / U${r.unit || 1}</span>
                                    </div>
                                    <h4 class="font-fun font-bold text-base text-slate-800 mb-1">${r.title || '互动测验'}</h4>
                                    <p class="text-xs text-slate-500 font-sans line-clamp-2">${r.description || '点击开始练习并积累积分！'}</p>
                                </div>
                                <div class="mt-4 pt-3 border-t border-slate-200 flex justify-end">
                                    <a href="${targetUrl}" class="neo-btn neo-btn-primary px-3.5 py-1.5 text-xs flex items-center gap-1.5">
                                        <i class="fa-solid fa-play"></i> 开始挑战
                                    </a>
                                </div>
                            </div>
                        `;
                    } else if (r.type === 'review') {
                        reviewCount++;
                        reviewContainer.innerHTML += `
                            <div class="resource-card p-4 bg-sky-50 flex flex-col justify-between">
                                <div>
                                    <div class="flex justify-between items-start mb-2">
                                        <span class="bg-sky-200 text-sky-900 border border-slate-900 font-bold px-2 py-0.5 rounded text-[11px] font-fun">${r.subject || '复习'}</span>
                                        <span class="text-xs bg-white border border-slate-300 px-2 py-0.5 rounded font-bold text-slate-600">${r.grade || 1}年级 / U${r.unit || 1}</span>
                                    </div>
                                    <h4 class="font-fun font-bold text-base text-slate-800 mb-1">${r.title || '复习指南'}</h4>
                                    <p class="text-xs text-slate-500 font-sans">${r.description || '复习核心知识点'}</p>
                                </div>
                                <div class="mt-4 pt-3 border-t border-slate-200 flex justify-end">
                                    <a href="${r.link || '#'}" target="_blank" class="neo-btn bg-white hover:bg-slate-100 px-3.5 py-1.5 text-xs flex items-center gap-1.5">
                                        <i class="fa-solid fa-file-pdf text-red-500"></i> 阅读讲义
                                    </a>
                                </div>
                            </div>
                        `;
                    }
                }
            });

            if (quizCount === 0) {
                quizContainer.innerHTML = `<div class="col-span-full p-6 text-center neo-card bg-white text-slate-400 font-fun text-xs">无匹配的测验项目</div>`;
            }
            if (reviewCount === 0) {
                reviewContainer.innerHTML = `<div class="col-span-full p-6 text-center neo-card bg-white text-slate-400 font-fun text-xs">无匹配的复习讲义</div>`;
            }
        }

        function handleLogout() {
            auth.signOut().then(() => { window.location.href = "index.html"; });
        }
    </script>
</body>
</html>
