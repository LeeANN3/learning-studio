<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAqp_1JyuAtpQgJtnFRLhuVEmUIrx1YetI",
        authDomain: "my-teacher-studio.firebaseapp.com",
        projectId: "my-teacher-studio",
        storageBucket: "my-teacher-studio.firebasestorage.app",
        messagingSenderId: "82774284780",
        appId: "1:82774284780:web:e29680ea7a0e5c435ec8c9"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;

    auth.onAuthStateChanged(async (user) => {
        if (!user) { window.location.href = "index.html"; return; }
        
        try {
            const userDoc = await db.collection("users").doc(user.uid).get();
            if (userDoc.exists) {
                currentUser = { uid: user.uid, ...userDoc.data() };
                renderProfileHeader();
                loadStudentClasses();
                loadAnnouncements();
            } else {
                // 如果 Auth 有记录但 Firestore 无文档，清理登出
                await auth.signOut();
                window.location.href = "index.html";
            }
        } catch (err) { console.error(err); }
    });

    function renderProfileHeader() {
        const isTeacher = currentUser.role === 'teacher';
        const isPending = currentUser.role === 'student' && currentUser.status === 'pending_approval';
        const name = currentUser.name || "使用者";

        document.getElementById('welcome-message').innerText = isTeacher ? `欢迎 ${name} 老师！` : `欢迎 ${name} 同学！`;
        document.getElementById('user-avatar-text').innerText = name.charAt(0);
        document.getElementById('user-identity-sub').innerText = currentUser.email || "";
        
        // 身份 Tag 判定
        if (isTeacher) {
            document.getElementById('user-role-tag').innerText = "👨‍🏫 教师/管理员";
            document.getElementById('btn-teacher-portal').classList.remove('hidden');
            document.getElementById('btn-manage-announcement').classList.remove('hidden');
        } else if (isPending) {
            document.getElementById('user-role-tag').innerText = "⏳ 待老师审核开通";
            document.getElementById('user-role-tag').className = "bg-rose-100 text-rose-800 border-2 border-slate-900 px-3 py-1 rounded-xl text-xs font-bold font-fun shadow-[2px_2px_0_#0f172a]";
        } else {
            document.getElementById('user-role-tag').innerText = "🎓 在读学生";
        }

        // 🔒 按钮权限管控：如果是未审核的学生，点击“进入学习岛”按钮时弹窗提示
        const dashboardBtn = document.querySelector('a[href="dashboard.html"]');
        if (dashboardBtn) {
            if (isPending) {
                dashboardBtn.onclick = (e) => {
                    e.preventDefault();
                    alert("🔒 你的账号正等待老师审核分配班级，开通后方可进入学习岛！");
                };
                dashboardBtn.className = "neo-btn bg-slate-200 text-slate-400 opacity-70 px-3.5 py-1.5 text-xs sm:text-sm flex items-center gap-1.5 cursor-not-allowed";
            } else {
                dashboardBtn.onclick = null;
            }
        }
    }

    async function loadStudentClasses() {
        const container = document.getElementById('enrolled-classes-container');
        const userClasses = currentUser.enrolledClasses || [];

        if (userClasses.length === 0) {
            container.innerHTML = `<div class="p-3 bg-slate-50 border border-slate-300 rounded-xl text-xs text-slate-500 italic">您暂未加入任何班级（等待老师分配中）。</div>`;
            return;
        }

        try {
            const classSnap = await db.collection("classes").get();
            container.innerHTML = '';

            let count = 0;
            classSnap.forEach(doc => {
                if (userClasses.includes(doc.id)) {
                    count++;
                    const c = doc.data();
                    container.innerHTML += `
                        <div class="p-3 bg-amber-50 border-2 border-slate-900 rounded-xl space-y-1">
                            <div class="flex justify-between items-center">
                                <span class="font-mono font-bold bg-amber-300 border border-slate-900 px-2 py-0.5 rounded text-xs">${doc.id}</span>
                                <span class="text-[11px] font-bold text-slate-500">${c.grade || 0} 年级</span>
                            </div>
                            <h4 class="font-fun font-bold text-slate-800 text-sm">${c.className || '班级'}</h4>
                            <div class="text-xs text-slate-600 flex items-center gap-1 mt-1 font-sans">
                                <i class="fa-regular fa-clock text-amber-600"></i>
                                <span>${c.scheduleDay || '未设星期'} (${c.scheduleTime || '未设时间'})</span>
                            </div>
                        </div>
                    `;
                }
            });

            if (count === 0) {
                container.innerHTML = `<div class="p-3 bg-slate-50 border border-slate-300 rounded-xl text-xs text-slate-500">已加入代码但未找到对应的活跃班级。</div>`;
            }

        } catch (err) { container.innerHTML = `<div class="text-xs text-red-500">读取课表失败</div>`; }
    }

    async function loadAnnouncements() {
        const container = document.getElementById('announcements-container');
        try {
            const snap = await db.collection("announcements").orderBy("createdAt", "desc").limit(10).get();
            container.innerHTML = '';

            if (snap.empty) {
                container.innerHTML = `<div class="p-6 text-center text-slate-400 text-xs italic">当前暂无公告通知。</div>`;
                return;
            }

            const userClasses = currentUser.enrolledClasses || [];
            let shownCount = 0;

            snap.forEach(doc => {
                const a = doc.data();
                const targetType = a.targetType || 'ALL';

                let canSee = false;
                if (currentUser.role === 'teacher') canSee = true;
                else if (targetType === 'ALL') canSee = true;
                else if (targetType === 'CLASS' && userClasses.includes(a.targetClass)) canSee = true;
                else if (targetType === 'STUDENT' && a.targetStudentUid === currentUser.uid) canSee = true;

                if (canSee) {
                    shownCount++;
                    const dateStr = a.createdAt ? new Date(a.createdAt.seconds * 1000).toLocaleDateString('zh-CN') : '-';
                    
                    let badgeHtml = `<span class="bg-sky-100 text-sky-800 border border-sky-300 px-2 py-0.5 rounded text-[10px] font-bold">全校公告</span>`;
                    if (targetType === 'CLASS') badgeHtml = `<span class="bg-amber-100 text-amber-800 border border-amber-300 px-2 py-0.5 rounded text-[10px] font-bold">班级专属: ${a.targetClass}</span>`;
                    if (targetType === 'STUDENT') badgeHtml = `<span class="bg-red-100 text-red-800 border border-red-300 px-2 py-0.5 rounded text-[10px] font-bold">个人私信/提醒</span>`;

                    container.innerHTML += `
                        <div class="p-4 bg-white border-2 border-slate-900 rounded-xl space-y-2 shadow-[2px_2px_0_#0f172a]">
                            <div class="flex justify-between items-center">
                                ${badgeHtml}
                                <span class="text-[11px] text-slate-400 font-mono">${dateStr}</span>
                            </div>
                            <h4 class="font-fun font-bold text-slate-900 text-base">${a.title}</h4>
                            <p class="text-xs text-slate-600 leading-relaxed font-sans whitespace-pre-line">${a.content}</p>
                        </div>
                    `;
                }
            });

            if (shownCount === 0) {
                container.innerHTML = `<div class="p-6 text-center text-slate-400 text-xs italic">暂无与您相关的通知。</div>`;
            }

        } catch (err) { container.innerHTML = `<div class="text-xs text-red-500">读取公告失败</div>`; }
    }

    function handleLogout() {
        auth.signOut().then(() => { window.location.href = "index.html"; });
    }
</script>
