<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun Learning Island - 游戏与测验资料管控</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Patrick+Hand&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            font-family: 'Patrick Hand', 'ZCOOL KuaiLe', cursive, sans-serif;
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
            background-size: 20px 20px;
            min-height: 100vh;
            color: #0f172a;
        }
        .font-fun { font-family: 'Fredoka', 'ZCOOL KuaiLe', cursive; }
        .neo-card {
            background-color: #ffffff;
            border: 2px solid #0f172a;
            border-radius: 16px;
            box-shadow: 4px 4px 0px #0f172a;
        }
        .neo-btn {
            background-color: #ffffff;
            border: 2px solid #0f172a;
            border-radius: 12px;
            box-shadow: 2px 2px 0px #0f172a;
            transition: all 0.15s ease;
            font-family: 'Fredoka', 'ZCOOL KuaiLe', cursive;
            font-weight: 600;
        }
        .neo-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0px #0f172a;
        }
        .neo-btn-primary { background-color: #ffe600; }
        .neo-btn-primary:hover { background-color: #facc15; }
        .neo-btn-success { background-color: #bbf7d0; color: #166534; }
        .neo-btn-danger { background-color: #fee2e2; color: #dc2626; border-color: #dc2626; box-shadow: 2px 2px 0px #dc2626; }
        .neo-input {
            border: 2px solid #0f172a;
            border-radius: 10px;
            outline: none;
            padding: 8px 12px;
            box-shadow: 2px 2px 0px #cbd5e1;
        }
        .neo-input:focus { box-shadow: 2px 2px 0px #ffe600; }
        .modal-overlay { background-color: rgba(15, 23, 42, 0.6); backdrop-filter: blur(2px); }
    </style>
</head>
<body class="pb-10">

    <nav class="bg-white border-b-2 border-slate-900 sticky top-0 z-40 px-4 py-3 shadow-[0_4px_0_#0f172a]">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-amber-300 p-2 rounded-xl border-2 border-slate-900 shadow-[2px_2px_0_#0f172a]">
                    <i class="fa-solid fa-gamepad text-xl"></i>
                </div>
                <div>
                    <h1 class="font-fun text-xl font-bold leading-tight">游戏与测验资料管控</h1>
                    <p class="text-xs text-slate-500 font-sans">Content & Quiz Manager</p>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <a href="admin.html" class="neo-btn px-3 py-1.5 text-sm flex items-center gap-2 bg-slate-100">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>返回教室后台</span>
                </a>
                <button onclick="openEditorForCreate()" class="neo-btn neo-btn-primary px-3 py-1.5 text-sm flex items-center gap-2">
                    <i class="fa-solid fa-plus-circle"></i>
                    <span>创建新测验/游戏</span>
                </button>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 mt-6">
        
        <div class="neo-card p-5 mb-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-fun text-xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-amber-500"></i>
                    <span>云端已发布的测验与游戏列表</span>
                </h3>
                <span class="text-xs text-slate-500">点击“修改”可同步更新题目，点击“删除”彻底移除。</span>
            </div>

            <div class="overflow-x-auto rounded-xl border-2 border-slate-900 bg-white">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100 border-b-2 border-slate-900 font-fun text-sm text-slate-800">
                            <th class="p-3">测验/游戏标题</th>
                            <th class="p-3">ID 编码</th>
                            <th class="p-3">分类类型</th>
                            <th class="p-3">科目 / 年级 / 单元</th>
                            <th class="p-3">题目数量</th>
                            <th class="p-3 text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="quiz-table-body" class="divide-y border-slate-200 text-sm font-sans">
                        <tr>
                            <td colspan="6" class="p-8 text-center text-slate-400 font-fun text-lg">
                                <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><br>正在加载云端题库资料...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- 测验编辑器弹窗 Modal -->
    <div id="editor-modal" class="fixed inset-0 modal-overlay z-50 flex items-center justify-center p-4 hidden">
        <div class="neo-card bg-white max-w-3xl w-full p-6 space-y-4 max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center border-b-2 border-slate-900 pb-3">
                <h3 id="editor-title" class="font-fun text-xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-amber-500"></i>
                    <span>编辑测验内容</span>
                </h3>
                <button onclick="closeEditorModal()" class="neo-btn px-2.5 py-1 text-xs">✕ 关闭</button>
            </div>

            <div class="flex-1 overflow-y-auto space-y-4 pr-1">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">测验全局唯一 ID (用于识别链接)</label>
                        <input type="text" id="quiz-id" class="neo-input w-full text-sm font-mono" placeholder="如: g1_chinese_u1">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">测验/游戏显示标题</label>
                        <input type="text" id="quiz-title" class="neo-input w-full text-sm font-bold" placeholder="如: 一年级华文 单元一测验">
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">科目</label>
                        <select id="quiz-subject" class="neo-input w-full bg-white text-xs font-fun">
                            <option value="chinese">华文 (Chinese)</option>
                            <option value="english">英文 (English)</option>
                            <option value="malay">国文 (Malay)</option>
                            <option value="math">数学 (Math)</option>
                            <option value="science">科学 (Science)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">目标年级</label>
                        <select id="quiz-grade" class="neo-input w-full bg-white text-xs font-fun">
                            <option value="1">一年级 (Grade 1)</option>
                            <option value="2">二年级 (Grade 2)</option>
                            <option value="3">三年级 (Grade 3)</option>
                            <option value="4">四年级 (Grade 4)</option>
                            <option value="5">五年级 (Grade 5)</option>
                            <option value="6">六年级 (Grade 6)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">目标单元</label>
                        <input type="number" id="quiz-unit" value="1" min="1" max="20" class="neo-input w-full text-xs font-bold">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3 bg-amber-50 p-3 rounded-xl border border-slate-900">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">资源模块划分 (决定出现在学生端哪个栏目)</label>
                        <select id="quiz-type" class="neo-input w-full bg-white text-xs font-fun">
                            <option value="quiz">📝 测验 (Quizzes)</option>
                            <option value="review">📖 复习 (Revision)</option>
                            <option value="game">🎮 游戏 (Educational Games)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">游戏机制 Runner 模板</label>
                        <select id="quiz-game-type" class="neo-input w-full bg-white text-xs font-fun">
                            <option value="multiple_choice">选择题 (quiz-runner.html)</option>
                            <option value="card_matching">记忆翻牌 (card-runner.html)</option>
                        </select>
                    </div>
                </div>

                <!-- 题目管理 -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <h4 class="font-fun text-base font-bold">题目与词汇列表</h4>
                        <button type="button" onclick="addWordRow()" class="neo-btn neo-btn-primary px-3 py-1 text-xs flex items-center gap-1">
                            <i class="fa-solid fa-plus"></i> 添加题目
                        </button>
                    </div>
                    
                    <div id="words-container" class="space-y-2 max-h-[220px] overflow-y-auto p-2 bg-slate-50 border-2 border-slate-900 rounded-xl">
                        <!-- Word Rows Dynamic Container -->
                    </div>
                </div>
            </div>

            <div class="flex justify-between items-center pt-3 border-t-2 border-slate-900">
                <div>
                    <button type="button" onclick="document.getElementById('file-input').click()" class="neo-btn px-3 py-1.5 text-xs bg-slate-100">
                        <i class="fa-solid fa-file-import"></i> 导入 JSON
                    </button>
                    <input type="file" id="file-input" accept=".json" class="hidden" onchange="importLocalJSON(event)">
                </div>
                <button type="button" onclick="saveToCloud()" class="neo-btn neo-btn-primary px-5 py-2 text-sm flex items-center gap-2">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <span>保存并同步云端</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAqp_1JyuAtpQgJtnFRLhuVEmUIrx1YetI",
            authDomain: "my-teacher-studio.firebaseapp.com",
            projectId: "my-teacher-studio",
            storageBucket: "my-teacher-studio.firebasestorage.app",
            messagingSenderId: "82774284780",
            appId: "1:82774284780:web:e29680ea7a0e5c435ec8c9"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        auth.onAuthStateChanged(async user => {
            if (!user) {
                window.location.href = "index.html";
            } else {
                loadQuizzes();
            }
        });

        async function loadQuizzes() {
            const tbody = document.getElementById('quiz-table-body');
            tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-400 font-fun text-lg"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><br>正在加载云端题库...</td></tr>`;

            try {
                const snapshot = await db.collection("quizzes").get();
                tbody.innerHTML = "";

                if (snapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-400 italic font-fun">暂无游戏/测验资料，点击右上角新建！</td></tr>`;
                    return;
                }

                snapshot.forEach(doc => {
                    const q = doc.data();
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-50 transition-colors";

                    const runnerPage = (q.gameType === 'card_matching') ? 'card-runner.html' : 'quiz-runner.html';

                    tr.innerHTML = `
                        <td class="p-3 font-bold font-fun text-slate-800 text-base">${q.quizTitle || doc.id}</td>
                        <td class="p-3 font-mono text-xs text-slate-500">${doc.id}</td>
                        <td class="p-3">
                            <span class="bg-amber-100 text-amber-900 border border-slate-900 text-xs px-2 py-0.5 rounded-md font-bold font-fun">
                                ${q.type || 'quiz'} (${q.gameType || 'multiple_choice'})
                            </span>
                        </td>
                        <td class="p-3 text-xs text-slate-600">${q.subject || '通用'} / ${q.grade || 1}年级 / 单元${q.unit || 1}</td>
                        <td class="p-3 text-xs font-mono font-bold text-slate-700">${(q.words || []).length} 题</td>
                        <td class="p-3 text-center">
                            <div class="flex items-center justify-center gap-2">
                                <button onclick="editQuiz('${doc.id}')" class="neo-btn px-2.5 py-1 text-xs bg-amber-100 hover:bg-amber-200">
                                    <i class="fa-solid fa-pen-to-square"></i> 修改
                                </button>
                                <a href="${runnerPage}?quizId=${doc.id}" target="_blank" class="neo-btn neo-btn-success px-2.5 py-1 text-xs flex items-center gap-1">
                                    <i class="fa-solid fa-play"></i> 测试
                                </a>
                                <button onclick="deleteQuiz('${doc.id}')" class="neo-btn neo-btn-danger px-2.5 py-1 text-xs">
                                    <i class="fa-solid fa-trash"></i> 删除
                                </button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-red-500 font-semibold">⚠️ 加载失败：${err.message}</td></tr>`;
            }
        }

        function openEditorForCreate() {
            document.getElementById('quiz-id').value = "quiz_" + Date.now().toString().slice(-6);
            document.getElementById('quiz-title').value = "";
            document.getElementById('quiz-grade').value = "1";
            document.getElementById('quiz-unit').value = "1";
            document.getElementById('words-container').innerHTML = "";
            addWordRow("Apple", "苹果");
            addWordRow("Banana", "香蕉");
            document.getElementById('editor-modal').classList.remove('hidden');
        }

        function closeEditorModal() {
            document.getElementById('editor-modal').classList.add('hidden');
        }

        function addWordRow(english = "", chinese = "") {
            const container = document.getElementById('words-container');
            const div = document.createElement('div');
            div.className = "word-row flex items-center gap-2 bg-white p-2 rounded-lg border border-slate-300";
            div.innerHTML = `
                <input type="text" class="input-english neo-input text-xs flex-1" placeholder="英文/题目" value="${english}">
                <input type="text" class="input-chinese neo-input text-xs flex-1" placeholder="中文/答案" value="${chinese}">
                <button type="button" onclick="this.parentElement.remove()" class="neo-btn neo-btn-danger px-2 py-1 text-xs">
                    <i class="fa-solid fa-trash"></i>
                </button>
            `;
            container.appendChild(div);
        }

        async function saveToCloud() {
            const quizId = document.getElementById('quiz-id').value.trim();
            const quizTitle = document.getElementById('quiz-title').value.trim();
            const subject = document.getElementById('quiz-subject').value;
            const grade = parseInt(document.getElementById('quiz-grade').value) || 1;
            const unit = parseInt(document.getElementById('quiz-unit').value) || 1;
            const type = document.getElementById('quiz-type').value;
            const gameType = document.getElementById('quiz-game-type').value;

            if (!quizId) return alert("请填写测验 ID！");

            const wordRows = document.querySelectorAll('.word-row');
            const words = [];
            wordRows.forEach((row, idx) => {
                const eng = row.querySelector('.input-english').value.trim();
                const chi = row.querySelector('.input-chinese').value.trim();
                if (eng && chi) {
                    words.push({ id: idx + 1, english: eng, chinese: chi });
                }
            });

            if (words.length === 0) return alert("请至少添加一组有效题目！");

            const runnerPage = (gameType === 'card_matching') ? 'card-runner.html' : 'quiz-runner.html';
            const targetUrl = `${runnerPage}?quizId=${quizId}`;

            // 获取属于该年级的活跃班级代码
            let classCodesForGrade = [];
            try {
                const classSnap = await db.collection("classes").where("grade", "==", grade).get();
                classSnap.forEach(doc => classCodesForGrade.push(doc.id));
            } catch(e){}

            const quizData = {
                quizId: quizId,
                quizTitle: quizTitle || quizId,
                subject: subject,
                grade: grade,
                unit: unit,
                type: type,
                gameType: gameType,
                words: words,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            const resourceData = {
                title: quizTitle || quizId,
                subject: subject,
                grade: grade,
                unit: unit,
                type: type,
                gameType: gameType,
                url: targetUrl,
                isPublished: true,
                unlockedClasses: classCodesForGrade,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                const batch = db.batch();
                batch.set(db.collection("quizzes").doc(quizId), quizData, { merge: true });
                batch.set(db.collection("resources").doc(quizId), resourceData, { merge: true });
                await batch.commit();

                alert("🎉 保存并发布成功！学生端已即时展示！");
                closeEditorModal();
                loadQuizzes();
            } catch (err) {
                alert("⚠️ 保存失败：" + err.message);
            }
        }

        async function editQuiz(id) {
            try {
                const docSnap = await db.collection("quizzes").doc(id).get();
                if (!docSnap.exists) return alert("未找到该测验数据！");
                const q = docSnap.data();

                document.getElementById('quiz-id').value = docSnap.id;
                document.getElementById('quiz-title').value = q.quizTitle || "";
                document.getElementById('quiz-subject').value = q.subject || "chinese";
                document.getElementById('quiz-grade').value = q.grade || 1;
                document.getElementById('quiz-unit').value = q.unit || 1;
                document.getElementById('quiz-type').value = q.type || "quiz";
                document.getElementById('quiz-game-type').value = q.gameType || "multiple_choice";

                const container = document.getElementById('words-container');
                container.innerHTML = "";
                if (Array.isArray(q.words)) {
                    q.words.forEach(w => addWordRow(w.english, w.chinese));
                }

                document.getElementById('editor-modal').classList.remove('hidden');
            } catch (err) { alert("读取失败：" + err.message); }
        }

        async function deleteQuiz(id) {
            if (!confirm(`确定彻底删除测验【${id}】吗？`)) return;
            try {
                const batch = db.batch();
                batch.delete(db.collection("quizzes").doc(id));
                batch.delete(db.collection("resources").doc(id));
                await batch.commit();
                loadQuizzes();
            } catch (err) { alert("删除失败：" + err.message); }
        }

        function importLocalJSON(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = JSON.parse(evt.target.result);
                    if (data.quizId) document.getElementById('quiz-id').value = data.quizId;
                    if (data.quizTitle) document.getElementById('quiz-title').value = data.quizTitle;
                    if (data.subject) document.getElementById('quiz-subject').value = data.subject;
                    if (data.grade) document.getElementById('quiz-grade').value = data.grade;
                    if (data.unit) document.getElementById('quiz-unit').value = data.unit;

                    document.getElementById('words-container').innerHTML = "";
                    if (Array.isArray(data.words)) {
                        data.words.forEach(w => addWordRow(w.english, w.chinese));
                    }
                    alert("JSON 导入成功！点击 [保存并同步云端] 即可发布。");
                } catch (err) { alert("JSON 读取失败：" + err.message); }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
